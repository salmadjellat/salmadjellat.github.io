<style>
/* Una sola escena de carretera, look de día fijo: la pista arriba, la tarjeta en el centro, Sisi y Zico como dos botones gigantes. */
:root{
  color-scheme:light;
  --cielo:#CDEBFF; --cielo2:#EEF8FF; --cesped:#9AD36A; --asfalto:#5D6770; --linea:#FFD34D;

  --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
html,body{height:100%}
body{background:linear-gradient(180deg,var(--cielo2),var(--cielo) 60%,var(--cesped) 60%);color:var(--tinta);font-family:var(--body);overflow-x:hidden}
.app{min-height:100%;box-sizing:border-box;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-width:1000px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,32px);background:var(--papel);padding:4px 16px;border-radius:999px;border:3px solid var(--tinta)}
.chip{font:800 14px var(--body);color:var(--tinta);background:var(--papel);border:3px solid var(--tinta);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid #1f6fd1;outline-offset:3px}

/* Carretera */
.pista{position:relative;height:78px;background:var(--asfalto);border-radius:16px;border:3px solid var(--tinta);overflow:hidden}
.pista::before{content:"";position:absolute;left:20px;right:70px;top:50%;border-top:5px dashed var(--linea)}
.paradas{position:absolute;inset:0 70px 0 20px;display:flex;justify-content:space-between;align-items:center}
.paradas b{width:14px;height:14px;border-radius:50%;background:#8D979F;border:2px solid #2b343b;transition:background .3s}

.coche{position:absolute;top:50%;width:84px;transform:translate(-50%,-50%);transition:left .8s cubic-bezier(.3,1.5,.5,1)}
.meta{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:46px;height:56px}

.pj:active{transform:translateY(6px);box-shadow:0 2px 0 var(--tinta)}
.pj svg{width:min(100%,190px);height:auto}
.pj .nom{font-size:clamp(24px,4vw,34px);font-weight:700}
.pj .son{font-size:16px;color:var(--tinta2);font-family:var(--body);font-weight:800}
#bSisi{background:var(--sisi-claro)} #bZico{background:var(--zico-claro)}
.pj.ok{animation:salto .6s} .pj.mal{animation:sacude .45s}
@keyframes salto{40%{transform:translateY(-14px) scale(1.04)}}
@keyframes sacude{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

.tarjeta{background:var(--papel);border:5px solid var(--tinta);border-radius:36px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-width:0}

.dibujo.oreja{background:#EEF6FF;border-color:#9CC6EA}
.oir{font:700 22px var(--display);color:var(--tinta);background:var(--oro);border:4px solid var(--tinta);border-radius:999px;padding:10px 22px;min-height:58px;cursor:pointer;box-shadow:0 5px 0 var(--tinta)}
.oir:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}

.opc{flex:1;max-width:170px;aspect-ratio:1;border:4px solid var(--tinta);border-radius:24px;background:var(--papel);font-size:clamp(56px,10vw,96px);font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;cursor:pointer;box-shadow:0 5px 0 var(--tinta);touch-action:manipulation}
.opc:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.opc.ok{background:var(--sisi-claro);animation:salto .6s}.opc.mal{background:#FFE1E1;animation:sacude .45s}
.gesto{width:min(100%,120px);height:auto}
.gtxt{font:800 13px var(--body);color:var(--tinta2);text-align:center;line-height:1.2}
.pista-gesto{display:flex;align-items:center;gap:10px;background:#FFF7DD;border:3px solid var(--tinta);border-radius:18px;padding:8px 14px;font:800 16px var(--body);text-align:left}
.pista-gesto .gesto{width:110px;flex:none}
.msg{font:600 20px var(--display);min-height:1.3em}
.palabra{font:800 15px var(--body);color:var(--tinta2);background:#F3EEE9;border-radius:10px;padding:4px 10px;border:2px dashed #D8C7B5;cursor:pointer;user-select:none}

/* Panel adulto */
details{background:rgba(255,255,255,.92);border:3px solid var(--tinta);border-radius:16px;padding:2px 14px}
summary{cursor:pointer;padding:10px 0;font-weight:800}
.ctrl{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;padding:4px 0 14px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--tinta2);font-weight:800}
select{font:700 16px var(--body);color:var(--tinta);background:var(--papel);border:2px solid var(--tinta);border-radius:10px;padding:8px 10px;min-height:44px}
.nota{font-size:14px;color:var(--tinta2);margin:0;width:100%;line-height:1.45}

/* Fiesta */
.fiesta{position:fixed;inset:0;background:rgba(30,40,55,.72);display:grid;place-items:center;z-index:5;padding:16px}
.fiesta .caja{background:var(--papel);border:5px solid var(--tinta);border-radius:30px;padding:24px 30px;text-align:center;max-width:420px}
.fiesta .grande{font:700 clamp(40px,8vw,64px) var(--display);color:var(--zico)}
.fiesta p{font-size:20px;font-weight:800;margin:6px 0 16px}
.trofeo{font-size:80px;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif}

@media (max-width:640px){
  .escena{grid-template-columns:1fr 1fr}
  .tarjeta{grid-column:1/-1;order:-1}
  .pj svg{width:min(100%,130px)}
}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const S=[['☀️','sol'],['🐸','sapo'],['🍄','seta'],['🪑','silla'],['🛋️','sofá'],['🍉','sandía'],['🌭','salchicha'],['🧜‍♀️','sirena'],['✉️','sobre'],['🧂','sal'],['🪚','serrucho'],['🍳','sartén'],['🐍','serpiente']];
  const Z=[['👞','zapato'],['🥕','zanahoria'],['🧃','zumo'],['🦓','cebra'],['🍒','cereza'],['🐷','cerdo'],['🎪','circo'],['🪥','cepillo'],['🧅','cebolla'],['🎬','cine'],['🦌','ciervo'],['🎃','calabaza'],['🍽️','cena'],['🚲','bicicleta']];
  // Nivel 3: parejas mínimas (solo audio)
  const P=[[['🤼','sumo'],['🧃','zumo']],[['🏠','casa'],['🏹','caza']],[['🪡','coser'],['🍲','cocer']],[['🍞','masa'],['🔨','maza']],[['🪑','siento'],['💯','ciento']],[['🪚','sierra'],['🚪','cierra']]];
  const st={nivel:1,voz:'adulto',meta:10,puntos:0,actual:null,bloqueo:false,cola:[]};
  try{const g=JSON.parse(localStorage.getItem('sisizico')||'{}');Object.assign(st,{nivel:g.nivel||1,meta:g.meta||10})}catch(e){}
  const guardar=()=>{try{localStorage.setItem('sisizico',JSON.stringify({nivel:st.nivel,meta:st.meta}))}catch(e){}};

  function decir(){}
  let audio=null;
  function tono(f,d){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.2,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d+.05)}catch(e){}}

  const PISTAS={s:[document.querySelector('#bSisi .gesto').outerHTML,'Sisi: lengua escondida y el dedo hace de serpiente, sssss'],z:[document.querySelector('#bZico .gesto').outerHTML,'Zico: la lengua asoma entre los dientes y el dedo la señala, zzzzz']};
  function mostrarPista(k){const p=$('pistaGesto');p.innerHTML=PISTAS[k][0]+'<span>'+PISTAS[k][1]+'</span>';p.hidden=false}
  function ocultarPista(){$('pistaGesto').hidden=true}
  function ponPal(w){const p=$('palabra');p.hidden=false;p.dataset.w='«'+w+'»';p.classList.remove('visto');p.textContent='👀 Palabra (solo para el adulto)';p.onclick=()=>{const v=p.classList.toggle('visto');p.textContent=v?p.dataset.w+' · ocultar':'👀 Palabra (solo para el adulto)'}}
  function barajar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function rellenar(){
    if(st.nivel===3){const c=[];P.forEach(([a,b])=>{c.push({e:a[0],w:a[1],k:'s',par:[a,b]});c.push({e:b[0],w:b[1],k:'z',par:[a,b]})});st.cola=barajar(c)}
    else st.cola=barajar([...S.map(([e,w])=>({e,w,k:'s'})),...Z.map(([e,w])=>({e,w,k:'z'}))]);
  }
  function pintarDibujo(){
    const d=$('dibujo');d.classList.toggle('doble',st.nivel===3);d.classList.toggle('oreja',st.nivel===2);
    if(st.nivel===3){
      const [a,b]=st.actual.par;
      d.innerHTML=`<button type="button" class="opc" data-k="s" aria-label="${a[1]}">${a[0]}</button><button type="button" class="opc" data-k="z" aria-label="${b[1]}">${b[0]}</button>`;
      d.querySelectorAll('.opc').forEach(x=>x.addEventListener('click',e=>{const bt=e.currentTarget;responder(bt.dataset.k,bt)}));
      $('msg').textContent='¿Cuál has oído?';
    } else d.textContent=st.nivel===1?st.actual.e:'👂';
  }
  function siguiente(){
    if(!st.cola.length)rellenar();
    st.actual=st.cola.pop();st.bloqueo=false;
    const d=$('dibujo');
    pintarDibujo();
    $('palabra').hidden=false;
    ponPal(st.actual.w);
    $('msg').textContent=st.nivel===3?'¿Cuál has oído?':'¿Sisi o Zico?';ocultarPista();
  }
  function pintar(){
    const m=st.meta;
    $('paradas').innerHTML=Array.from({length:m+1},(_,i)=>`<b class="${i<=st.puntos?'hecha':''}"></b>`).join('');
    const w=$('coche').parentElement.clientWidth,ini=20,fin=w-70;
    $('coche').style.left=(ini+(fin-ini)*Math.min(st.puntos,m)/m)+'px';
  }
  function responder(k,btn){
    if(!st.actual||st.bloqueo)return;
    st.bloqueo=true;
    const ok=k===st.actual.k;
    btn.classList.remove('ok','mal');void btn.offsetWidth;btn.classList.add(ok?'ok':'mal');
    if(ok){
      st.puntos++;pintar();tono(660,.15);setTimeout(()=>tono(880,.2),140);
      $('msg').textContent=['¡Muy bien!','¡Genial!','¡Eso es!','¡Bravo!'][Math.floor(Math.random()*4)];
      if(st.puntos>=st.meta){setTimeout(()=>{$('fiesta').hidden=false;tono(523,.2);setTimeout(()=>tono(784,.4),220)},900);return}
      setTimeout(siguiente,1300);
    }else{
      tono(220,.25);
      const quien=st.actual.k==='s'?'Sisi':'Zico';
      $('msg').textContent='Era de '+quien+'. ¡Mira el gesto!';
      mostrarPista(st.actual.k);
      if(st.nivel!==3)$('dibujo').textContent=st.actual.e;
      setTimeout(()=>{st.cola.unshift(st.actual);siguiente()},3200);
    }
  }
  function reiniciar(){st.puntos=0;$('fiesta').hidden=true;rellenar();pintar();siguiente()}

  $('bSisi').addEventListener('click',e=>responder('s',e.currentTarget));
  $('bZico').addEventListener('click',e=>responder('z',e.currentTarget));
    $('bReiniciar').addEventListener('click',reiniciar);
  $('bOtra').addEventListener('click',reiniciar);
  const sN=$('selNivel'),sM=$('selMeta');
  sN.value=String(st.nivel);sM.value=String(st.meta);
  sN.addEventListener('change',()=>{st.nivel=+sN.value;guardar();rellenar();siguiente()});
    sM.addEventListener('change',()=>{st.meta=+sM.value;guardar();pintar()});
  addEventListener('resize',pintar);
  rellenar();pintar();
  // Primera tarjeta sin hablar: el audio solo puede sonar tras un toque
  st.actual=st.cola.pop();
  pintarDibujo();
  $('palabra').hidden=false;ponPal(st.actual.w);
  $('msg').textContent=st.nivel===3?'¿Cuál has oído?':'¿Sisi o Zico?';
})();
</script>
