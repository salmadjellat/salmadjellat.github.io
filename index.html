<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis juegos</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
:root{--bg:#FAF5EE;--card:#fff;--ink:#4A3326;--soft:#7A6252;--line:#E8D9C5;--pink:#E0A0B8;--brown:#6F4A30;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',Verdana,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding-block:32px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(30px,7vw,42px);margin:0;line-height:1.1}
.lab{font-family:'Fredoka',sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--soft)}
p{margin:0;line-height:1.5;font-size:17px;color:var(--soft)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #7FB1D3;outline-offset:3px}
.foot{font-size:13px;color:var(--soft);text-align:center;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}

.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.key{font-size:56px;line-height:1}
input{font:700 26px 'Fredoka',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-align:center;width:100%;max-width:320px;padding:14px;border:3px solid var(--line);border-radius:18px;background:var(--bg);color:var(--ink)}
.go{font:700 22px 'Fredoka',sans-serif;background:var(--pink);color:#fff;border:none;border-radius:999px;padding:14px 34px;box-shadow:0 4px 0 #C97A9A}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #C97A9A}
.err{color:#B4532A;font-weight:800;min-height:1.4em}
</style></head><body><div class="wrap">
<div class="lab">Logopedia · Salma Djellat</div>
<h1>Mis juegos</h1>
<form class="card" id="f" autocomplete="off">
<div class="key" aria-hidden="true">🔑</div>
<p>Escribe tu código secreto para entrar en tu zona de juegos.</p>
<label for="code" class="lab">Código</label>
<input id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="TU CÓDIGO">
<button class="go" type="submit">Entrar</button>
<div class="err" id="err" role="alert"></div>
</form>
<div class="foot">Salma Djellat · Logopeda</div>
</div>
<script>
async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16)}
async function go(h,silent){
  try{const r=await fetch('./'+h+'/index.html',{cache:'no-store'});if(r.ok){try{localStorage.setItem('zona',h)}catch(e){};location.href='./'+h+'/';return true}}catch(e){}
  if(!silent)document.getElementById('err').textContent='Ese código no es correcto. Revísalo y vuelve a probar.';
  return false;
}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
  const c=document.getElementById('code').value.toUpperCase().replace(/\s+/g,'');
  if(!c){document.getElementById('err').textContent='Escribe tu código.';return}
  go(await hash(c));});
try{const s=localStorage.getItem('zona');if(s)go(s,true)}catch(e){}
</script></body></html>
