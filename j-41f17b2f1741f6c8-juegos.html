<style>
/* Circuito de carreras: asfalto con línea discontinua, cada acierto es un punto. */
:root{

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cesped);color:var(--tinta);font-family:var(--display)}
body{background:linear-gradient(90deg,#5DBB63 0 6%,#4A4F55 6% 94%,#5DBB63 94%),#4A4F55}body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(180deg,#F2F2F2 0 40px,transparent 40px 80px) center/8px 100% no-repeat;opacity:.5;pointer-events:none;z-index:-1}

.juego{background:var(--papel);border:4px solid var(--tinta);border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 0 var(--tinta);transition:transform .1s}

.juego .estrellas{color:var(--oro);font-size:16px}
/* campo de juego */
.campo{background:var(--papel);border:4px solid var(--tinta);border-radius:28px;padding:18px clamp(12px,3vw,26px) 22px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 7px 0 var(--tinta);position:relative;overflow:hidden}
.titulo{font-size:22px;font-weight:700;text-align:center}

.dibujo{font-size:clamp(90px,22vw,150px);line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;user-select:none}
.opciones{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.op{min-width:84px;min-height:84px;padding:10px 18px;background:#F4F8FB;border:4px solid var(--tinta);border-radius:22px;font-family:var(--letra);font-weight:700;font-size:clamp(34px,8vw,48px);box-shadow:0 5px 0 var(--tinta);transition:transform .1s,background .2s}
.op:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.op.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:clamp(46px,11vw,64px)}
.op.ok{background:#D9F7E5;border-color:var(--ok)}
.op.mal{background:#FFE1E1;animation:sacude .4s;opacity:.5}

.palabra{display:flex;gap:8px;align-items:center;font-family:var(--letra);font-weight:700;font-size:clamp(46px,12vw,70px)}

.progreso{display:flex;gap:6px;justify-content:center}

.progreso i.hecho{background:var(--oro)}
.final{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.trofeo{font-size:110px;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif;animation:salto 1s infinite}
@keyframes salto{50%{transform:translateY(-12px)}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--azul);color:#fff;border:4px solid var(--tinta);border-radius:999px;padding:12px 24px;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--tinta)}
.btn.blanco{background:#fff;color:var(--tinta)}
.nota{background:rgba(255,255,255,.92);border-radius:16px;padding:12px 16px;font-family:var(--letra);font-size:15px;line-height:1.5;color:var(--suave)}
.nota b{color:var(--tinta)}
@media (max-width:560px){.menu{grid-template-columns:1fr}.sil{min-width:86px}.porteria{min-height:110px;font-size:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.com-l{font-weight:800;color:#4A3326;background:rgba(255,255,255,.9);border-radius:10px;padding:4px 10px}.com-l span{font-weight:600;color:#7A6252;font-size:13px}.com-t{width:100%;font:inherit;font-size:16px;border:2px solid #E8D9C5;border-radius:14px;padding:10px;resize:vertical;background:#fff;color:#4A3326}.wa-btn.mail{background:#6F4A30}.wa-otro{font:inherit;font-weight:800;background:rgba(255,255,255,.9);border:2px solid #25D366;color:#1E8E4C;border-radius:999px;padding:8px 16px;cursor:pointer}.env-ok{font-weight:800;color:#2E6B47;background:rgba(255,255,255,.9);border-radius:10px;padding:2px 10px;min-height:0}.env-ok:empty{display:none}
.wa-caja{display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px auto 0;max-width:420px;width:100%;text-align:center}.wa-btn{font:inherit;font-weight:800;font-size:17px;background:#25D366;color:#fff;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}.wa-caja small{color:#7A6252;background:rgba(255,255,255,.85);border-radius:10px;padding:4px 10px;font-size:13px}
.juego.hoy{box-shadow:0 0 0 4px #F2C94C,0 8px 20px rgba(0,0,0,.12)}.hoy-b{background:#FFF3C4!important;color:#8A6A00!important}.dia-msg{background:rgba(255,255,255,.92);color:#4A3326;border-radius:16px;padding:10px 14px;font-weight:700;margin:4px 0 10px;text-align:center}
.juego.cerrado{opacity:.55;filter:grayscale(.7);cursor:not-allowed}.juego.cerrado:hover{transform:none}.candado{display:inline-block;margin-top:4px;font-size:13px;font-weight:800;color:#8A6E5C;background:#F1E8DC;border-radius:999px;padding:2px 10px}.modal-cod{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}.caja-cod{background:#fff;border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center;color:#4A3326;font-family:Nunito,Verdana,sans-serif}.caja-cod b{font-size:20px}.caja-cod p{margin:6px 0 12px;color:#7A6252}.caja-cod input{width:100%;font:inherit;font-size:24px;font-weight:800;text-align:center;letter-spacing:.12em;padding:10px;border:2px solid #E8D9C5;border-radius:14px;text-transform:uppercase}.err-cod{color:#A2403B;font-weight:700;min-height:22px;margin-top:6px;font-size:14px}.bts-cod{display:flex;gap:10px;margin-top:8px}.bts-cod button{flex:1;font:inherit;font-weight:800;border-radius:14px;padding:12px;border:2px solid #E8D9C5;background:#fff;color:#6F4A30;cursor:pointer}.bts-cod .cod-si{background:#6F4A30;color:#fff;border-color:#6F4A30}.tengo-cod{display:block;margin:14px auto 0;font:inherit;font-weight:800;background:#fff;color:#6F4A30;border:2px dashed #C9B6A0;border-radius:999px;padding:10px 18px;cursor:pointer}
.aviso-cerrado{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#4A3326;color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;z-index:99;max-width:90vw;text-align:center}
.adulto-b{font:inherit;font-weight:700;font-size:15px;background:#F1E8DC;color:#6F4A30;border:2px dashed #C9B49E;border-radius:999px;padding:6px 14px;max-width:100%}.adulto-b.visto{background:#FFF6D6;border-style:solid}
.sil.dada{font-size:clamp(34px,9vw,52px);background:#FFF6D6;cursor:pointer}.op.coche{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:clamp(46px,11vw,64px)}.op.suena{background:#FFF3C4;transform:scale(1.08)}
</style><script>document.write('<script src="abiertos.js?t='+Date.now()+'"><\/script>')</script></head><body>
<div class="wrap" id="app"></div>
<script>
const E={casa:'🏠',silla:'🪑',luna:'🌙',sapo:'🐸',pato:'🦆',gato:'🐱',foca:'🦭',vaca:'🐄',mono:'🐒',lobo:'🐺',pera:'🍐',dado:'🎲',rosa:'🌹',nube:'☁️',coche:'🚗',uvas:'🍇',oso:'🐻',moto:'🏍️',cama:'🛏️',sopa:'🍲',bota:'👢',seta:'🍄',sandía:'🍉',tambor:'🥁',limón:'🍋',
sol:'☀️',pez:'🐟',tren:'🚂',flor:'🌸',pan:'🍞',pie:'🦶',
pelota:'⚽',tomate:'🍅',conejo:'🐰',patata:'🥔',zapato:'👞',gallina:'🐔',manzana:'🍎',ballena:'🐋',jirafa:'🦒',caracol:'🐌',tortuga:'🐢',
mariposa:'🦋',elefante:'🐘',cocodrilo:'🐊',bicicleta:'🚲',calabaza:'🎃',
mano:'✋',nariz:'👃',ratón:'🐭',tomate2:'🍅',árbol:'🌳',isla:'🏝️',
boca:'👄',rana:'🐸',camión:'🚚',león:'🦁',corazón:'❤️',abeja:'🐝',oveja:'🐑',lechuga:'🥬',espejo:'🪞',chocolate:'🍫',ventana:'🪟'};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>pickNuevo(a,n);
const RONDAS=8;
const app=document.getElementById('app');
let goles=0; try{goles=+localStorage.getItem('martin-puntos')||0}catch(e){}
let est={}; try{est=JSON.parse(localStorage.getItem('martin-est')||'{}')}catch(e){}
const guardar=()=>{try{localStorage.setItem('martin-puntos',goles);localStorage.setItem('martin-est',JSON.stringify(est))}catch(e){}};

/* ---------- datos de cada juego ---------- */
Object.assign(E,{mapa:'🗺️',pila:'🔋',pino:'🌲',patín:'🛼',lata:'🥫',lupa:'🔍',lana:'🧶',melón:'🍈',tele:'📺',naranja:'🍊',lápiz:'✏️',tigre:'🐯',taza:'☕',serpiente:'🐍',maleta:'🧳',plato:'🍽️',foto:'📷',aceituna:'🫒',mesa:'🪑'});
delete E.mesa;
function decir(t,r){try{if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=r||.8;const v=speechSynthesis.getVoices().find(v=>/^es/i.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
/* palabras de dos sílabas con m, p, s, t, n, l */
const MITAD=[['ma','no','mano'],['mo','no','mono'],['mo','to','moto'],['ma','pa','mapa'],['pa','to','pato'],['pi','la','pila'],['pi','no','pino'],['pa','tín','patín'],['sa','po','sapo'],['se','ta','seta'],['so','pa','sopa'],['lu','na','luna'],['la','ta','lata'],['lu','pa','lupa'],['la','na','lana'],['li','món','limón'],['me','lón','melón'],['te','le','tele']];
const REALES=new Set('palo pala pasa papa pata pana mama masa mata mala malo mesa mona misa mina mimo pesa peso pelo pena pipa pino pisa piso pila pita polo pomo pone puma sopa sapo sala seta sola solo sono suma supo sumo tapa tela tema tila tina tipo toma tono tope toso luna lupa lata lana lima lino lisa liso lomo loma losa lote nata nene nena nota nulo pato mapa mano mono moto mula mulo sano sana tata tapo topo tomo lapa napa mete meta mapa limón melón patín sapo mamá papá tele tela lelo leme lena lepe pino pina mino mono mole mota mote'.split(' '));
const INI=[['mono','m'],['moto','m'],['mano','m'],['mapa','m'],['manzana','m'],['mariposa','m'],['melón','m'],
 ['pato','p'],['pera','p'],['pez','p'],['pelota','p'],['patata','p'],['pino','p'],['pila','p'],['pie','p'],
 ['sol','s'],['silla','s'],['seta','s'],['sandía','s'],['sapo','s'],['sopa','s'],['serpiente','s'],
 ['tomate','t'],['tren','t'],['tortuga','t'],['tambor','t'],['tele','t'],['tigre','t'],['taza','t'],
 ['nube','n'],['nariz','n'],['naranja','n'],
 ['luna','l'],['lobo','l'],['león','l'],['limón','l'],['lápiz','l'],['lata','l'],['lupa','l'],['lana','l']];
const RIMAS=[['gato','pato','zapato','plato'],['foca','boca'],['pelota','bota'],['caracol','sol'],['manzana','ventana'],['ratón','camión','león','corazón','limón','melón'],['abeja','oveja'],['tortuga','lechuga'],['conejo','espejo'],['tomate','chocolate'],['seta','maleta'],['moto','foto'],['luna','aceituna'],['lata','patata']];

const JUEGOS=[
 {id:'sisi-zico',ico:'🐍',nombre:'Sisi y Zico',desc:'Está en «Mis juegos».',fuera:true},
 {id:'inicial',ico:'👂',nombre:'¿Cuál empieza igual?',desc:'Busca el dibujo que empieza con el mismo sonido.'},
 {id:'rimas',ico:'🎵',nombre:'Cazarrimas',desc:'¿Cuál suena igual al final?'},
 {id:'mitad',ico:'🧩',nombre:'La otra mitad',desc:'Escucha y elige el trozo que falta.'},
].filter(j=>!j.fuera);
const COCHES=['🚗','🚙','🚕'];

/* ---------- menú ---------- */
function menu(){
  location.hash='';
  app.innerHTML=`<div class="top"><a class="chip" href="j-41f17b2f1741f6c8.html">← Mis juegos</a><div class="marcador">🏁 Puntos <b>${goles}</b></div></div>
  <h1>La carrera de las palabras</h1><p class="sub">Elige un juego. ¡Cada acierto es un punto!</p>
  <div class="menu">${JUEGOS.map(j=>`<button class="juego" data-id="${j.id}"><span class="ico">${j.ico}</span><span class="t"><b>${j.nombre}</b><span>${j.desc}</span><span class="estrellas">${est[j.id]?'🏆 ×'+est[j.id]:''}</span></span></button>`).join('')}</div>
  <div class="nota"><b>Para el adulto:</b> los juegos van sin letras para que Martín escuche y diga las palabras. Con el botón «👀 Para el adulto» podéis ver el nombre de los dibujos o los trozos de palabra; volved a tocarlo para ocultarlo. En «La otra mitad», los cochecitos suenan al tocarlos (si la tablet no habla, decid vosotros los trozos). Si falla dos veces, la respuesta correcta brilla para ayudarle.</div>`;
  app.querySelectorAll('.juego').forEach(b=>b.onclick=()=>empezar(b.dataset.id));
}

/* ---------- motor común ---------- */
let J=null;
function empezar(id){J={id,ronda:0,fallos:0,items:generar(id)};location.hash=id;pintar()}
function generar(id){
  if(id==='inicial')return pick(INI,RONDAS).map(([w,l])=>{const iguales=INI.filter(x=>x[1]===l&&x[0]!==w);const b=sh(iguales)[0][0];const otros=sh(INI.filter(x=>x[1]!==l));const o=[];const ls=new Set();for(const x of otros){if(!ls.has(x[1])){ls.add(x[1]);o.push(x[0])}if(o.length===2)break}return [w,b,o]});
  if(id==='rimas')return pick(RIMAS,RONDAS).map(g=>{const [a,b]=sh(g).slice(0,2);const otros=sh(RIMAS.filter(x=>x!==g)).slice(0,2).map(x=>sh(x)[0]);return [a,b,otros]});
  if(id==='mitad')return pick(MITAD,RONDAS).map(([s1,s2,w])=>{const falta=Math.random()<.5?0:1;const dada=falta?s1:s2,ok=falta?s2:s1;
    const pool=[...new Set(MITAD.map(x=>x[falta]))].filter(s=>s!==ok&&!REALES.has(falta?dada+s:s+dada));const ops=sh([ok,...sh(pool).slice(0,2)]);return {w,falta,dada,ok,ops}});
}
function cabecera(){
  return `<div class="top"><button class="chip" id="volver">← Juegos</button><div class="marcador">🏁 Puntos <b>${goles}</b></div></div>
  <div class="progreso">${Array.from({length:RONDAS},(_,i)=>`<i class="${i<J.ronda?'hecho':''}">${i<J.ronda?'🏁':''}</i>`).join('')}</div>`;
}
function bAdulto(txt){return `<button class="adulto-b" id="adulto" data-w="${txt}">👀 Para el adulto</button>`}
function pintar(){
  if(J.ronda>=RONDAS)return final();
  J.fallos=0;
  const it=J.items[J.ronda];let cuerpo='';
  if(J.id==='inicial'){
    const [a,b,otros]=it;const ops=sh([b,...otros]);
    cuerpo=`<div class="titulo">¿Cuál empieza igual?</div><div class="consigna">Di el nombre del dibujo. ¿Cuál empieza con el mismo sonido?</div>
    <div class="dibujo">${E[a]}</div>${bAdulto('«'+a+'» → '+ops.map(x=>x).join(' · '))}
    <div class="opciones">${ops.map(s=>`<button class="op emo" data-v="${s}">${E[s]}</button>`).join('')}</div>`;
  }
  if(J.id==='rimas'){
    const [a,b,otros]=it;const ops=sh([b,...otros]);
    cuerpo=`<div class="titulo">Cazarrimas</div><div class="consigna">¿Cuál termina igual que este?</div>
    <div class="dibujo">${E[a]}</div>${bAdulto('«'+a+'» → '+ops.join(' · '))}
    <div class="opciones">${ops.map(s=>`<button class="op emo" data-v="${s}">${E[s]}</button>`).join('')}</div>`;
  }
  if(J.id==='mitad'){
