const CONF={b:['d','p'],d:['b','t'],p:['b','q'],t:['d','f'],m:['n'],n:['m','ñ'],l:['r','ll'],r:['l'],c:['g'],g:['c'],f:['v','t'],s:['z'],z:['s'],v:['f','b'],a:['o','e'],e:['a','i'],o:['a','u'],i:['e'],u:['o']};
const REALSET=new Set(REALES);
function mutar(w,nivel){
  const L=[...w];for(let k=0;k<40;k++){let r=L.slice();const tipo=nivel>=2&&Math.random()<.35?'swap':'sub';
    if(tipo==='swap'){const i=1+Math.floor(Math.random()*(r.length-2));[r[i],r[i+1]]=[r[i+1],r[i]]}
    else{const idx=r.map((c,i)=>CONF[c]?i:-1).filter(i=>i>0);if(!idx.length)continue;const i=una(idx);r[i]=una(CONF[r[i]])}
    const s=r.join('');if(s!==w&&!REALSET.has(s)&&!/(.)\1\1/.test(s))return s}
  return w.slice(0,-1)+'o';
}

function pseudo(n,nivel){for(let k=0;k<30;k++){let s=[];for(let i=0;i<n;i++){let pool=SIL1;if(nivel>=3&&Math.random()<.35)pool=Math.random()<.5?SIL3:SILI;else if(nivel>=2&&Math.random()<.2)pool=SIL3;s.push(una(pool))}

const VIS={b:'d',d:'b',p:'q',q:'p',m:'n',n:'m',u:'n',l:'t',t:'l',a:'o',o:'a',e:'c',c:'e',f:'t',h:'n',r:'n'};
function variantes(w,n){const out=new Set();let k=0;while(out.size<n&&k<200){k++;let r=[...w];const t=Math.random();
  if(t<.45){const idx=r.map((c,i)=>VIS[c]?i:-1).filter(i=>i>=0);if(!idx.length)continue;const i=una(idx);r[i]=VIS[r[i]]}
  else if(t<.8){const i=Math.floor(Math.random()*(r.length-1));[r[i],r[i+1]]=[r[i+1],r[i]]}
  else{const i=1+Math.floor(Math.random()*(r.length-1));r.splice(i,1)}

function empezar(id){const nivel=NIVEL(id);J={id,nivel,ronda:0,fallos:0,primera:0};J.items=generar(id,nivel);J.rondas=J.items.length;location.hash=id;pintar()}
function generar(id,n){
  if(id==='existe'){const r=pick(REALES.filter(w=>n===1?w.length<=7:n===2?w.length<=9:true),10);return r.map((w,i)=>i%2?{w,real:true}:{w:mutar(w,n),real:false}).sort(()=>Math.random()-.5)}
  if(id==='gemela'){return Array.from({length:10},()=>{const s=pseudo(n===1?2:n===2?3:(Math.random()<.5?3:4),n);const w=s.join('');return {w,ops:sh([w,...variantes(w,3)])}})}
  if(id==='laboratorio')return Array.from({length:10},()=>labItem(n));
  if(id==='separa')return pick(FRA[n],6);
  if(id==='detective')return pick(INF.filter(x=>x[0]<=n&&x[0]>=n-1),8);
  if(id==='lectura'){const t=pick(TXT.filter(x=>x[0]===n),2);return t.flatMap(x=>x[3].map(q=>({t:x,q})))}
  if(id==='caza')return pick(CAZA[n],5);
  if(id==='ran'){const tipos=n===1?['c','o','n','l']:n===2?['o','n','l','cn']:['n','l','ln','co'];return tipos}
}
function labItem(n){
  const s=pseudo(n===1?(Math.random()<.5?2:3):3,n===3?2:1);const w=s.join('');let q,ok,otros,p1;
  const ops=n===1?['inv2','quita','anade']:n===2?['inv3','quitaM','cambiaS','anade']:['quitaF','cambiaF','anadeF','inv3'];
  const op=una(ops);
  if(op==='inv2'||(op==='inv3'&&s.length<3)){const r=s.slice().reverse();q=`Dale la vuelta por sílabas a <b>${s.join('-')}</b>`;ok=r.join('');otros=[s.join(''),s[1]+s[1],s[0]+s[0]];p1='Di la última sílaba primero.'}
  else if(op==='inv3'){q=`Dale la vuelta por sílabas a <b>${s.join('-')}</b>`;ok=s.slice().reverse().join('');otros=[s[2]+s[0]+s[1],s[1]+s[0]+s[2],s[0]+s[2]+s[1]];p1='Empieza por la última sílaba y ve hacia atrás.'}
  else if(op==='quita'){const i=Math.random()<.5?0:s.length-1;q=`Quita <b>${s[i]}</b> a <b>${w}</b>`;ok=s.filter((_,k)=>k!==i).join('');otros=[s.filter((_,k)=>k!==(i?0:s.length-1)).join(''),w,s[i]];p1='Sepárala en sílabas con palmadas y no digas esa.'}
  else if(op==='quitaM'){q=`Quita <b>${s[1]}</b> a <b>${w}</b>`;ok=s[0]+s[2];otros=[s[1]+s[2],s[0]+s[1],s[2]+s[0]];p1='La sílaba que quitas está en medio.'}
  else if(op==='anade'){const x=una(SIL1);const ini=Math.random()<.5;q=`Añade <b>${x}</b> al ${ini?'principio':'final'} de <b>${w}</b>`;ok=ini?x+w:w+x;otros=[ini?w+x:x+w,x+s.slice(1).join(''),w];p1=ini?'La nueva sílaba va delante.':'La nueva sílaba va detrás.'}
  else if(op==='cambiaS'){const i=Math.floor(Math.random()*3);const x=una(SIL1.filter(y=>!s.includes(y)));q=`Cambia <b>${s[i]}</b> por <b>${x}</b> en <b>${w}</b>`;const r=s.slice();r[i]=x;ok=r.join('');const r2=s.slice();r2[(i+1)%3]=x;otros=[r2.join(''),w+x,x+w];p1='Solo cambia un trozo; los demás se quedan igual.'}
  else if(op==='quitaF'){const ws=w;const c=ws[0];q=`Quita el sonido <b>/${c}/</b> del principio de <b>${ws}</b>`;ok=ws.slice(1);otros=[ws.slice(0,-1),ws.slice(0,1)+ws.slice(2),ws];p1='Quita solo el primer sonido, no la sílaba entera.'}
  else if(op==='cambiaF'){const idx=[...w].map((c,i)=>CONF[c]&&!'aeiou'.includes(c)?i:-1).filter(i=>i>=0);const i=idx.length?una(idx):0;const nu=CONF[w[i]]?CONF[w[i]][0]:'l';q=`Cambia <b>/${w[i]}/</b> por <b>/${nu}/</b> en <b>${w}</b>`;ok=w.slice(0,i)+nu+w.slice(i+1);const j=idx.find(k=>k!==i);otros=[j!==undefined?w.slice(0,j)+nu+w.slice(j+1):nu+w,w,w.slice(0,i)+w.slice(i+1)];p1='Busca ese sonido y cambia solo ese.'}
  else{const cons=[...w].findIndex(c=>'bcdfgpt'.includes(c));const i=cons<0?0:cons;const x=Math.random()<.5?'r':'l';q=`Añade <b>/${x}</b> después de <b>/${w[i]}/</b> en <b>${w}</b>`;ok=w.slice(0,i+1)+x+w.slice(i+1);otros=[x+w,w+x,w.slice(0,i)+x+w.slice(i)];p1='Se forma una trabada: como en «bra» o «pla».'}
  otros=[...new Set(otros.filter(o=>o&&o!==ok))];while(otros.length<3)otros.push(mutar(ok,2));
  return {q,ok,ops:sh([ok,...otros.slice(0,3)]),pistas:[p1,`El resultado empieza por «${ok[0]}».`]};
}

function darPista(){const n=J.fallos-2;if(n<0||!PISTAS.length)return;let t=PISTAS[Math.min(n,PISTAS.length-1)];

  app.innerHTML=cabecera()+`<div class="campo" id="campo">${head}<div class="consigna">Toca entre las letras para separar las palabras. Vuelve a tocar para quitar la raya.</div>
  <div class="frase" id="frase">${h}</div><div class="btns"><button class="btn" id="comp">Comprobar</button></div>
  <div class="pista" id="pista"><span>💡</span><span id="pistaT"></span></div><div class="msg" id="msg"></div></div>`;
