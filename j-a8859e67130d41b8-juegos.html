<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El taller de slime</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Un castillo de cuento al atardecer: cielo lila con estrellas, torres y hadas; cada acierto es una estrella mágica. Un único aspecto, elegido a propósito. */
:root{
  --cesped:#B9A2F5; --cesped2:#F7B8D6; --linea:#FFFFFF; --cielo:#BFE6FF;
  --tinta:#23313B; --suave:#5B6B76; --papel:#FFFFFF; --oro:#FFC93C; --rojo:#E5484D; --azul:#2F7DD3; --ok:#1F9D55;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif; --letra:'Andika','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light; --acento:#D63384;
}
*{box-sizing:border-box}
html{background:#FFC6E2}html,body{margin:0;min-height:100vh;color:var(--tinta);font-family:var(--display)}
body{background:radial-gradient(circle at 20% 30%,#ffffff70 0 10px,transparent 11px) 0 0/120px 120px,radial-gradient(circle at 70% 70%,#ffffff55 0 6px,transparent 7px) 0 0/90px 90px,linear-gradient(160deg,#9EE6D0,#FFC6E2);background-attachment:fixed}
button{font:inherit;cursor:pointer;border:none;color:inherit;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--oro);outline-offset:3px}
.wrap{max-width:820px;margin:0 auto;padding-block:14px 30px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{background:var(--papel);border:3px solid var(--tinta);border-radius:999px;padding:8px 16px;font-weight:600;font-size:16px;text-decoration:none;color:var(--tinta);display:inline-flex;gap:6px;align-items:center}
.marcador{background:var(--tinta);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.marcador b{color:var(--oro);font-size:24px}
h1{margin:0;font-size:clamp(30px,7vw,46px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center;line-height:1.05}
.sub{color:#fff;text-align:center;font-size:18px;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.2)}
/* menú */
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.juego{background:var(--papel);border:4px solid var(--tinta);border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 0 var(--tinta);transition:transform .1s}
.juego:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tinta)}
.juego .ico{font-size:44px;line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.juego .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.juego b{font-size:21px}
.juego span{font-size:15px;color:var(--suave);font-family:var(--letra)}
.juego .estrellas{color:var(--oro);font-size:16px}
/* campo de juego */
.campo{background:var(--papel);border:4px solid var(--tinta);border-radius:28px;padding:18px clamp(12px,3vw,26px) 22px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 7px 0 var(--tinta);position:relative;overflow:hidden}
.titulo{font-size:22px;font-weight:700;text-align:center}
.consigna{font-family:var(--letra);font-size:18px;color:var(--suave);text-align:center;margin-top:-10px}
.dibujo{font-size:clamp(90px,22vw,150px);line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;user-select:none}
.opciones{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.op{min-width:84px;min-height:84px;padding:10px 18px;background:#F4F8FB;border:4px solid var(--tinta);border-radius:22px;font-family:var(--letra);font-weight:700;font-size:clamp(34px,8vw,48px);box-shadow:0 5px 0 var(--tinta);transition:transform .1s,background .2s}
.op:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.op.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:clamp(46px,11vw,64px)}
.op.ok{background:#D9F7E5;border-color:var(--ok)}
.op.mal{background:#FFE1E1;animation:sacude .4s;opacity:.5}
.op.pista{animation:brilla 1s infinite}
@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes brilla{50%{box-shadow:0 0 0 8px var(--oro)}}
.palabra{display:flex;gap:8px;align-items:center;font-family:var(--letra);font-weight:700;font-size:clamp(46px,12vw,70px)}
.sil{min-width:110px;text-align:center;padding:4px 14px;border-radius:18px;background:#FFF6D6;border:4px solid var(--tinta)}
.sil.hueco{background:#fff;border-style:dashed;color:#B9C4CC}
.balones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bal{width:76px;height:76px;border-radius:50%;background:#fff;border:4px solid var(--tinta);font-size:34px;font-weight:700;display:grid;place-items:center;box-shadow:0 5px 0 var(--tinta)}
.palmas{display:flex;gap:8px;min-height:44px;font-size:34px;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif}
.palmar{background:var(--oro);border:4px solid var(--tinta);border-radius:999px;padding:10px 22px;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--tinta)}
.porterias{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.porteria{border:5px solid var(--tinta);border-radius:6px 6px 0 0;min-height:140px;background:linear-gradient(#EDE3FF,#D9C8FF);-webkit-mask:linear-gradient(#000 0 0) 0 22px/100% 100% no-repeat,repeating-linear-gradient(90deg,#000 0 22%,transparent 22% 33%) 0 0/100% 24px no-repeat;mask:linear-gradient(#000 0 0) 0 22px/100% 100% no-repeat,repeating-linear-gradient(90deg,#000 0 22%,transparent 22% 33%) 0 0/100% 24px no-repeat;padding-top:22px;display:grid;place-items:center;font-family:var(--letra);font-weight:700;font-size:64px;position:relative}
.porteria.ok{background:#D9F7E5}.porteria.mal{animation:sacude .4s}
.adulto{border:2px dashed #C9B6F2;cursor:pointer;font-family:var(--letra);font-weight:700;font-size:16px;color:var(--suave);background:#F3EEF9;border-radius:10px;padding:4px 12px;margin-top:-6px}
.personajes{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%}
.pers{background:#F7F1FF;border:4px solid var(--tinta);border-radius:24px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--tinta)}
.pers:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.pers .cara{font-size:clamp(56px,14vw,80px);line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.pers b{font-size:26px}.pers span:last-child{font-family:var(--letra);font-size:24px;font-weight:700;color:#8A4FD8}
.pers.ok{background:#D9F7E5;border-color:var(--ok)}.pers.mal{background:#FFE1E1;animation:sacude .4s;opacity:.5}.pers.pista{animation:brilla 1s infinite}
.msg{font-size:22px;font-weight:700;min-height:1.3em;text-align:center}
.gol{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.85);font-size:clamp(46px,12vw,80px);font-weight:700;color:#8A4FD8;pointer-events:none;animation:gol 1s forwards}
@keyframes gol{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.progreso{display:flex;gap:6px;justify-content:center}
.progreso i{width:22px;height:22px;border-radius:50%;background:#E3E8EC;border:2px solid var(--tinta);display:block;font-style:normal;font-size:14px;line-height:18px;text-align:center}
.progreso i.hecho{background:var(--oro)}
.final{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.trofeo{font-size:110px;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif;animation:salto 1s infinite}
@keyframes salto{50%{transform:translateY(-12px)}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--azul);color:#fff;border:4px solid var(--tinta);border-radius:999px;padding:12px 24px;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--tinta)}
.btn.blanco{background:#fff;color:var(--tinta)}
.nota{background:rgba(255,255,255,.92);border-radius:16px;padding:12px 16px;font-family:var(--letra);font-size:15px;line-height:1.5;color:var(--suave)}
.nota b{color:var(--tinta)}
@media (max-width:560px){.menu{grid-template-columns:1fr}.sil{min-width:86px}.porteria{min-height:110px;font-size:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.frase{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-family:var(--letra);font-size:clamp(24px,6vw,32px);line-height:1.3}
.pal{background:#F4F8FB;border:3px solid var(--tinta);border-radius:14px;padding:6px 12px;font-weight:700;box-shadow:0 4px 0 var(--tinta)}
.pal.ok{background:#D9F7E5;border-color:var(--ok);color:var(--ok)}.pal.mal{background:#FFE1E1;animation:sacude .4s;opacity:.5}.pal.pista{animation:brilla 1s infinite}
.letra-grande{font-family:var(--letra);font-weight:700;font-size:clamp(70px,18vw,110px);line-height:1;color:var(--acento)}
.personajes{grid-template-columns:repeat(2,1fr)}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
const CFG={clave:'paula-slime',volver:'j-a8859e67130d41b8.html',icono:'🫧',unidad:'Slime',premio:'💎',
 titulo:'El taller de slime',sub:'Cada acierto añade una gota de slime. ¡A por el bote lleno!',
 bien:['¡Slime perfecto!','¡Genial!','¡Muy bien!','¡Brillante!','¡Así se hace!'],finTitulo:'¡Bote lleno!',finTexto:'Has conseguido 8 gotas de slime en este juego.',
 nota:'<b>Para el adulto:</b> en los juegos de escuchar, la palabra está tapada tras el botón «👀 Palabra»: miradla vosotros y decidla con naturalidad, sin exagerar el sonido, para que Paula discrimine solo de oído. Si falla dos veces, la respuesta correcta brilla. En <b>Completa con sentido</b> y <b>Corrige la frase</b> sí lee ella: dejadle tiempo y que lo lea en voz alta.'};

const LET={d:{e:'🎲',t:'d'},l:{e:'🌙',t:'l'},r:{e:'🦋',t:'r'}};
const W={
 d:[['dado','🎲'],['nido','🪺'],['moneda','🪙'],['candado','🔒'],['diente','🦷'],['espada','🗡️'],['ducha','🚿'],['nudo','🪢'],['medusa','🪼']],
 l:[['luna','🌙'],['lobo','🐺'],['vela','🕯️'],['ola','🌊'],['limón','🍋'],['león','🦁'],['sol','☀️'],['abuela','👵'],['maleta','🧳'],['pelota','⚽']],
 r:[['pera','🍐'],['toro','🐂'],['oreja','👂'],['corona','👑'],['jirafa','🦒'],['cereza','🍒'],['sirena','🧜‍♀️'],['mariposa','🦋'],['tijeras','✂️'],['canguro','🦘']]};
const PSEUDO={d:['dupa','teda','mido','fedo','sadu','nuda'],l:['lefo','pilu','mela','tulo','sifa','nalu'],r:['fera','tiru','meri','nore','seru','fira']};
const persDLR=()=>['d','l','r'].map(k=>({v:k,e:LET[k].e,t:k.toUpperCase()+' '+k}));
function rondaDLR(conDibujo){
  const it=sh([...pick(W.d,3).map(x=>[...x,'d']),...pick(W.l,3).map(x=>[...x,'l']),...pick(W.r,2).map(x=>[...x,'r'])]);
  return it.map(([w,e,k])=>({tipo:'pers',ok:k,escena:`<div class="dibujo">${conDibujo?e:'👂'}</div>${adulto(w)}`,ops:persDLR()}));
}
const COMP=[['ca','😊','ra'],['pe','🍐','ra'],['o','🌊','la'],['da','🎲','do'],['to','🐂','ro'],['ve','🕯️','la'],['mone','🪙','da'],['hela','🍦','do'],['ni','🪺','do'],['lo','🦜','ro'],['espa','🗡️','da'],['escale','🪜','ra'],['abue','👵','la'],['ho','⏰','ra']];
const FRASES=[
 ['El','lodo','de','mi','abuela','habla','mucho.','loro'],
 ['Me','gusta','comer','pela','con','yogur.','pera'],
 ['En','verano','tomo','un','helaro','de','fresa.','helado'],
 ['La','sirena','nada','en','el','mal.','mar'],
 ['Tiro','el','lado','para','jugar','al','parchís.','dado'],
 ['Por','la','noche','sale','la','duna.','luna'],
 ['La','princesa','lleva','una','colona.','corona'],
 ['El','pájaro','duerme','en','su','niro.','nido'],
 ['Guardo','una','monera','en','la','hucha.','moneda'],
 ['Mi','slime','es','de','colol','rosa.','color'],
 ['Me','lavo','la','cala','con','agua.','cara'],
 ['Cierro','la','puelta','de','casa.','puerta'],
 ['Mi','perro','mueve','la','cora','cuando','está','contento.','cola'],
 ['La','jilafa','tiene','el','cuello','muy','largo.','jirafa'],
 ['Hago','una','pulsera','con','cuentas','de','cololes.','colores'],
 ['El','toro','code','por','el','campo.','corre']];
const MAL=new Set(['lodo','pela','helaro','mal','lado','duna','colona','niro','monera','colol','cala','puelta','cora','jilafa','cololes','code']);
const JUEGOS=[
 {id:'dlr1',ico:'🎧',nombre:'¿D, L o R?',desc:'Escucha y elige el sonido.',consigna:'Escucha la palabra. ¿Tiene d, l o r?',gen:()=>rondaDLR(true)},
 {id:'dlr2',ico:'👂',nombre:'Solo de oído',desc:'Sin dibujo: ¡orejas atentas!',consigna:'Escucha sin mirar ningún dibujo. ¿Tiene d, l o r?',gen:()=>rondaDLR(false)},
 {id:'dlr3',ico:'🪄',nombre:'Palabras inventadas',desc:'Palabras que no existen.',consigna:'Es una palabra inventada. ¿Qué sonido tiene: d, l o r?',
  gen:()=>sh([...pick(PSEUDO.d,3).map(w=>[w,'d']),...pick(PSEUDO.l,3).map(w=>[w,'l']),...pick(PSEUDO.r,2).map(w=>[w,'r'])]).map(([w,k])=>({tipo:'pers',ok:k,escena:`<div class="dibujo">🪄</div>${adulto(w)}`,ops:persDLR()}))},
 {id:'caza',ico:'🔎',nombre:'Caza el sonido',desc:'¿Qué dibujo tiene el sonido?',
  gen:()=>{const ks=sh(['d','l','r','d','l','r','d','l']);return ks.map(k=>{const otros=['d','l','r'].filter(x=>x!==k);const b=pick(W[k],1)[0];const ds=otros.map(o=>pick(W[o],1)[0]);
   return {ok:b[0],consigna:`Di el nombre de cada dibujo. ¿Cuál tiene el sonido <b>${k}</b>?`,escena:`<div class="letra-grande">${k.toUpperCase()} ${k}</div>`,ops:sh([b,...ds]).map(([w,e])=>({v:w,t:e,emo:1}))}})}},
 {id:'completa',ico:'🧩',nombre:'Completa con sentido',desc:'Elige el trozo que forma la palabra del dibujo.',consigna:'¿Qué trozo completa la palabra para que sea el dibujo?',
  gen:()=>pick(COMP,RONDAS).map(([a,e,b])=>{const v=b[1];const ops=sh(['d','l','r'].map(c=>c+v));return {ok:b,escena:`<div class="dibujo">${e}</div><div class="palabra"><span class="sil">${a}</span><span class="sil hueco" id="hueco">?</span></div>`,ops:ops.map(o=>({v:o,t:o})),
   alAcertar:()=>{const h=document.getElementById('hueco');h.textContent=b;h.classList.remove('hueco')}}})},
 {id:'frases',ico:'📝',nombre:'Corrige la frase',desc:'Encuentra la palabra que suena mal.',consigna:'Lee la frase en voz alta. Toca la palabra que está mal dicha.',
  gen:()=>pick(FRASES,RONDAS).map(f=>{const bien=f[f.length-1];const ws=f.slice(0,-1);const malo=ws.find(w=>MAL.has(w.replace(/[.,]/g,'')));
   return {tipo:'frase',ok:malo,ops:ws.map(w=>({v:w,t:w})),alAcertar:b=>{b.textContent=bien+(malo.endsWith('.')?'.':'');}}})}
];

const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>sh(a).slice(0,n);
const RONDAS=8;
const app=document.getElementById('app');
let puntos=0; try{puntos=+localStorage.getItem(CFG.clave+'-puntos')||0}catch(e){}
let est={}; try{est=JSON.parse(localStorage.getItem(CFG.clave+'-est')||'{}')}catch(e){}
const guardar=()=>{try{localStorage.setItem(CFG.clave+'-puntos',puntos);localStorage.setItem(CFG.clave+'-est',JSON.stringify(est))}catch(e){}};
const adulto=w=>`<button class="adulto" onclick="this.textContent=this.dataset.w" data-w="«${w}»">👀 Palabra (solo para el adulto)</button>`;
const EMO=e=>`<span class="emo-i">${e}</span>`;

function menu(){
  history.replaceState(null,'',location.pathname);J=null;
  app.innerHTML=`<div class="top"><a class="chip" href="${CFG.volver}">← Mis juegos</a><div class="marcador">${CFG.icono} ${CFG.unidad} <b>${puntos}</b></div></div>
  <h1>${CFG.titulo}</h1><p class="sub">${CFG.sub}</p>
  <div class="menu">${JUEGOS.map(j=>`<button class="juego" data-id="${j.id}"><span class="ico">${j.ico}</span><span class="t"><b>${j.nombre}</b><span>${j.desc}</span><span class="estrellas">${est[j.id]?CFG.premio+' ×'+est[j.id]:''}</span></span></button>`).join('')}</div>
  <div class="nota">${CFG.nota}</div>`;
  app.querySelectorAll('.juego').forEach(b=>b.onclick=()=>empezar(b.dataset.id));
}
let J=null;
function empezar(id){const g=JUEGOS.find(x=>x.id===id);J={id,g,ronda:0,fallos:0,items:g.gen()};if(location.hash.slice(1)!==id)location.hash=id;pintar()}
function cabecera(){
  return `<div class="top"><button class="chip" id="volver">← Juegos</button><div class="marcador">${CFG.icono} ${CFG.unidad} <b>${puntos}</b></div></div>
  <div class="progreso">${Array.from({length:RONDAS},(_,i)=>`<i class="${i<J.ronda?'hecho':''}">${i<J.ronda?CFG.icono:''}</i>`).join('')}</div>`;
}
function pintar(){
  if(J.ronda>=RONDAS)return final();
  J.fallos=0;const r=J.items[J.ronda];
  let ops='';
  if(r.tipo==='frase')ops=`<div class="frase">${r.ops.map(o=>`<button class="pal" data-v="${o.v}">${o.t}</button>`).join(' ')}</div>`;
  else if(r.tipo==='pers')ops=`<div class="personajes" style="grid-template-columns:repeat(${r.ops.length},1fr)">${r.ops.map(o=>`<button class="pers" data-v="${o.v}"><span class="cara">${o.e}</span><b>${o.t}</b>${o.s?`<span>${o.s}</span>`:''}</button>`).join('')}</div>`;
  else ops=`<div class="opciones">${r.ops.map(o=>`<button class="op${o.emo?' emo':''}" data-v="${o.v}">${o.t}</button>`).join('')}</div>`;
  app.innerHTML=cabecera()+`<div class="campo" id="campo"><div class="titulo">${J.g.nombre}</div><div class="consigna">${r.consigna||J.g.consigna}</div>${r.escena||''}${ops}<div class="msg" id="msg"></div></div>`;
  document.getElementById('volver').onclick=menu;
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>responder(b));
}
const correcta=()=>J.items[J.ronda].ok;
function responder(btn){
  if(J.bloq||btn.disabled)return;
  const r=J.items[J.ronda];
  if(btn.dataset.v===String(r.ok)){
    J.bloq=true;btn.classList.add('ok');puntos++;guardar();
    if(r.alAcertar)r.alAcertar(btn);
    const g=document.createElement('div');g.className='gol';g.textContent=CFG.bien[Math.floor(Math.random()*CFG.bien.length)];
    setTimeout(()=>document.getElementById('campo')&&document.getElementById('campo').appendChild(g),r.alAcertar?700:0);
    setTimeout(()=>{J.bloq=false;J.ronda++;pintar()},r.alAcertar?2000:1200);
  }else{
    J.fallos++;btn.classList.add('mal');btn.disabled=true;
    document.getElementById('msg').textContent=J.fallos>=2?'¡Mira la que brilla!':'¡Casi! Prueba otra vez.';
    if(J.fallos>=2)app.querySelectorAll('[data-v]').forEach(b=>{if(b.dataset.v===String(r.ok))b.classList.add('pista')});
  }
}
function final(){
  est[J.id]=(est[J.id]||0)+1;guardar();
  app.innerHTML=cabecera()+`<div class="campo"><div class="final"><div class="trofeo">${CFG.premio}</div><div class="titulo" style="font-size:32px">${CFG.finTitulo}</div>
  <div class="consigna" style="margin:0">${CFG.finTexto}</div>
  <div class="btns"><button class="btn" id="otra">Jugar otra vez</button><button class="btn blanco" id="menu">Otros juegos</button></div></div></div>`;
  document.getElementById('volver').onclick=menu;document.getElementById('menu').onclick=menu;document.getElementById('otra').onclick=()=>empezar(J.id);
}
const h0=location.hash.slice(1);
