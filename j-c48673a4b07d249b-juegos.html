 while(out.size<n&&tries<300){tries++;const a=[...w];const k=Math.floor(Math.random()*4);

/* ---------- generadores ---------- */
let J=null;
function empezar(id){J={id,ronda:0,fallos:0,primera:0,nivel:NIVEL(),t0:Date.now()};J.items=generar(id);location.hash=id;pintar()}
function generar(id){
  const n=J.nivel;
  if(id==='dibujo')return pick(DIB[n],RONDAS).map(([w,e])=>({w,e,ops:sh([w,...casi(w,2)])}));
  if(id==='iguales')return Array.from({length:RONDAS},()=>{const w=pick([...REAL[n],...PSEU[n]],1)[0];const f=casi(w,6);const cartas=sh([w,w,w,...f.slice(0,n===1?3:6)]);return {w,cartas}});
  if(id==='pareja')return Array.from({length:RONDAS},()=>{const ws=sh([...REAL[n],...PSEU[n]]).slice(0,n===1?2:3);const sola=casi(ws[0],1)[0]||ws[0]+'s';return {sola,cartas:sh([...ws.flatMap(w=>[w,w]),sola])}});
  if(id==='repite')return Array.from({length:RONDAS},()=>{const w=pick([...REAL[n],...PSEU[n]],1)[0];const otra=casi(w,1)[0]||(w.slice(0,-1)+(w.endsWith('a')?'o':'a'));const N=n===1?5:n===2?7:9;const c=Array(N-1).fill(w);c.splice(Math.floor(Math.random()*N),0,otra);return {w,otra,cartas:c}});
  if(id==='sopa')return [sopa(n),sopa(n)];
  if(id==='lectura')return pick(REAL[n],RONDAS);
  if(id==='magicas')return pick(PSEU[n],RONDAS);
  if(id==='existe'){const r=pick(REAL[n],4).map(w=>({w,k:'si'}));const p=[...pick(PSEU[n],2).map(w=>({w,k:'no'})),...pick(REAL[n],2).map(w=>({w:casi(w,1)[0]||w+'r',k:'no'}))];return sh([...r,...p])}
}
function sopa(n){
  const S=n===1?7:n===2?8:9;const L=n===1?4:n===2?5:7;
  const ws=sh(PSEU[n].filter(w=>w.length<=S)).slice(0,4);
  for(let intento=0;intento<200;intento++){
    const g=Array.from({length:S},()=>Array(S).fill(''));const pos=[];let ok=true;
    for(const w of ws){let puesto=false;
      for(let t=0;t<80&&!puesto;t++){const v=Math.random()<.5;const r=Math.floor(Math.random()*(v?S-w.length+1:S)),c=Math.floor(Math.random()*(v?S:S-w.length+1));
        let cabe=true;for(let i=0;i<w.length;i++){const x=v?r+i:r,y=v?c:c+i;if(g[x][y]&&g[x][y]!==w[i]){cabe=false;break}}
        if(cabe){for(let i=0;i<w.length;i++){const x=v?r+i:r,y=v?c:c+i;g[x][y]=w[i]}pos.push({w,r,c,v,hallada:false});puesto=true}}
      if(!puesto){ok=false;break}}
    if(!ok)continue;
    const AB='abcdefghijlmnoprstu';for(let x=0;x<S;x++)for(let y=0;y<S;y++)if(!g[x][y])g[x][y]=AB[Math.floor(Math.random()*AB.length)];
    return {S,g,pos}}
}

function correcta(){const it=J.items[J.ronda];
  return {dibujo:it.w,pareja:it.sola,repite:it.otra,existe:it.k}[J.id]}
const BIEN=['⚽ ¡GOL!','¡Golazo!','¡Experimento superado!','¡Crack!','¡Bravo!'];
function celebrar(){goles++;guardar();const g=document.createElement('div');g.className='gol';g.textContent=BIEN[Math.floor(Math.random()*BIEN.length)];document.getElementById('campo').appendChild(g)}
function siguiente(ms){J.bloq=true;setTimeout(()=>{J.bloq=false;J.ronda++;pintar()},ms||1200)}
function responder(btn){
  if(J.bloq)return;
  if(J.id==='lectura'||J.id==='magicas'){clearInterval(J.tick);if(btn.dataset.v==='bien'){J.primera++;celebrar()}else{document.getElementById('msg').textContent='¡Leedla juntos una vez y seguimos!'}btn.classList.add('ok');return siguiente(btn.dataset.v==='bien'?1100:2200)}

  app.querySelectorAll('.carta').forEach(b=>b.onclick=()=>{if(J.bloq||b.classList.contains('ok'))return;

function montarSopa(){const B=J.items[Math.floor(J.ronda/4)];let ini=null;
  const L=(x,y)=>app.querySelector(`.le[data-x="${x}"][data-y="${y}"]`);
  B.pos.filter(p=>p.hallada).forEach(p=>{for(let i=0;i<p.w.length;i++)L(p.v?p.r+i:p.r,p.v?p.c:p.c+i).classList.add('hallada')});
  app.querySelectorAll('.le').forEach(b=>b.onclick=()=>{if(J.bloq)return;const x=+b.dataset.x,y=+b.dataset.y;
