<style>
:root{--bg:#FAF5EE;--card:#fff;--ink:#4A3326;--soft:#7A6252;--line:#E8D9C5;--pink:#E0A0B8;--brown:#6F4A30;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',Verdana,sans-serif}

.list{display:flex;flex-direction:column;gap:14px}
.game{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-left:10px solid #E0A0B8;border-radius:24px;padding:18px;text-decoration:none;color:var(--ink);transition:transform .15s}

.arr{font-family:'Fredoka',sans-serif;font-size:28px;color:#E0A0B8}
.out{align-self:center;background:none;border:2px solid var(--line);border-radius:999px;padding:8px 18px;color:var(--soft);font-weight:800;font-size:14px}
