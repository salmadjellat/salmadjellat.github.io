<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style></head><body>
<title>Pulsera de pistas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Mesa de manualidades: una tarjeta grande de lectura y, encima, el hilo donde se ensartan las cuentas ganadas. Un único aspecto pastel claro, elegido a propósito. */
:root{
  --bg:#FFF6FA; --paper:#FFFFFF; --ink:#3B2B45; --soft:#7A6684; --line:#F1DDEA;
  --pink:#FF8FB8; --lilac:#B9A2F5; --mint:#7FD9C0; --lemon:#FFD966; --sky:#8CC8F5;
  --ok:#2FA67F; --okbg:#E3F7EF; --try:#C9B8D6;
  --display:'Fredoka',ui-rounded,'Trebuchet MS',sans-serif;
  --body:'Atkinson Hyperlegible',Verdana,Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:18px}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,7vw,48px);line-height:1.05}
h2{font-size:26px}
.sub{color:var(--soft);font-size:18px;line-height:1.5;margin:0}
button{font:inherit;cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}

/* hilo de cuentas */
.thread{position:relative;height:56px;display:flex;align-items:center;gap:4px;padding:0 14px;overflow:hidden}
.thread::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;background:repeating-linear-gradient(90deg,#E6B6CF 0 10px,#F3D3E3 10px 20px);border-radius:3px}
.bead{position:relative;width:34px;height:34px;flex:0 0 34px;border-radius:50%;box-shadow:inset -4px -5px 0 rgba(0,0,0,.08),inset 4px 4px 0 rgba(255,255,255,.55);border:2px solid rgba(59,43,69,.15)}
.bead.slot{background:transparent;border:2px dashed #E6B6CF;box-shadow:none}
.bead.glitter{background-image:radial-gradient(circle at 30% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 65% 60%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 45% 75%,#fff 0 1px,transparent 2px)}
.bead.new{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateY(-40px) scale(.3)}to{transform:none}}

/* inicio */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lv{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .15s}
.lv:hover{transform:translateY(-2px)}
.lv .tag{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lv .name{font-family:var(--display);font-size:24px;font-weight:700}
.lv .desc{color:var(--soft);font-size:16px;line-height:1.4}
.lv .got{font-size:15px;color:var(--soft);display:flex;align-items:center;gap:6px}
.lv .mini{display:flex;gap:3px;flex-wrap:wrap}
.lv .mini i{width:12px;height:12px;border-radius:50%;display:block}
.tip{background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:14px 16px;font-size:16px;line-height:1.5;color:var(--soft)}
.tip b{color:var(--ink)}

/* juego */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-family:var(--display);font-weight:600;color:var(--ink)}
.count{font-family:var(--display);font-weight:600;color:var(--soft)}
.card{background:var(--paper);border-radius:26px;padding:22px clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:18px;box-shadow:0 6px 0 var(--line)}
.text{font-size:clamp(21px,3.6vw,25px);line-height:1.75;margin:0;letter-spacing:.01em}
.text mark{background:transparent;color:inherit;border-radius:4px;padding:0;transition:background .4s,box-shadow .4s}
.text.show mark{background:var(--lemon);box-shadow:0 0 0 2px var(--lemon)}
.q{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.35;margin:0;display:flex;gap:10px;align-items:flex-start}
.q .lupa{flex:0 0 auto;font-size:22px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:14px 18px;text-align:left;font-size:20px;line-height:1.4;color:var(--ink);display:flex;gap:12px;align-items:center;transition:background .2s,border-color .2s,opacity .3s}
.opt .l{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:16px;background:var(--paper);border:2px solid var(--line)}
.opt:hover:not(:disabled){border-color:var(--lilac)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{opacity:.45;border-style:dashed;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:18px;padding:14px 16px;font-size:18px;line-height:1.5}
.fb.hint{background:#FFF4D6}
.fb.good{background:var(--okbg)}
.fb b{font-family:var(--display);font-weight:600}
.next{align-self:flex-end;background:var(--pink);color:#fff;font-family:var(--display);font-weight:700;font-size:20px;border-radius:999px;padding:12px 26px;box-shadow:0 4px 0 #E5679A}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 #E5679A}

/* final */
.end{background:var(--paper);border-radius:26px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 6px 0 var(--line)}
.ring{width:min(260px,70vw);aspect-ratio:1;position:relative;max-width:100%}
.ring .bead{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px}
.ring::before{content:"";position:absolute;inset:15px;border-radius:50%;border:3px solid #F3D3E3}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink)}
@media (max-width:520px){.levels{grid-template-columns:1fr}.bead{width:26px;height:26px;flex-basis:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
// [[...]] marca la pista que se ilumina al acertar
const LEVELS=[
 {tag:'Nivel 1',name:'Frases',desc:'Una frase y una pregunta.',color:'var(--pink)',items:[
  {t:'Laura abrió el [[paraguas]] al salir de casa.',q:'¿Qué tiempo hacía?',a:'Estaba lloviendo.',o:['Hacía mucho calor.','Era de noche.'],h:'¿Para qué sirve un paraguas?'},
  {t:'Marcos se puso el [[pijama]] y [[bostezó]].',q:'¿Qué va a hacer Marcos?',a:'Irse a dormir.',o:['Ir al colegio.','Jugar al fútbol.'],h:'Fíjate en lo que se pone y en lo que hace con la boca.'},
  {t:'Sofía [[sopló las velas]] mientras todos [[cantaban]].',q:'¿Qué estaban celebrando?',a:'Su cumpleaños.',o:['Que empezaba el colegio.','Que había ganado un partido.'],h:'¿Cuándo soplamos velas y nos cantan?'},
  {t:'El perro [[movía la cola sin parar]] al ver a Hugo.',q:'¿Cómo se sentía el perro?',a:'Contento.',o:['Enfadado.','Asustado.'],h:'¿Qué hace un perro con la cola cuando está feliz?'},
  {t:'Pablo llegó a casa [[lleno de barro]] y con el [[balón]] bajo el brazo.',q:'¿Qué había estado haciendo?',a:'Jugar al fútbol.',o:['Nadar en la piscina.','Leer un libro.'],h:'Mira lo que lleva bajo el brazo.'},
  {t:'Daniel [[tiritaba]] y tenía la [[nariz roja]].',q:'¿Qué le pasaba a Daniel?',a:'Tenía frío.',o:['Tenía calor.','Tenía sueño.'],h:'¿Cuándo tiritamos?'},
  {t:'Al ver el plato de brócoli, Nora [[arrugó la nariz]].',q:'¿Qué piensa Nora del brócoli?',a:'Que no le gusta.',o:['Que le encanta.','Que huele a flores.'],h:'¿Qué cara ponemos cuando algo no nos gusta?'},
  {t:'Irene [[miró el reloj]] y [[salió corriendo]] hacia la parada.',q:'¿Qué le pasa a Irene?',a:'Llega tarde al autobús.',o:['Está haciendo deporte.','Ha perdido el reloj.'],h:'¿Por qué miramos el reloj y corremos?'},
 ]},
 {tag:'Nivel 2',name:'Mini historias',desc:'Dos o tres frases seguidas.',color:'var(--lilac)',items:[
  {t:'Mateo dejó el helado en la mesa para atarse los zapatos. Cuando volvió, solo había un [[charco]] en el plato.',q:'¿Qué pasó con el helado?',a:'Se derritió.',o:['Se lo comió el perro.','Lo tiró su hermana.'],h:'¿Qué le pasa al helado si lo dejamos fuera?'},
  {t:'Los niños entraron en clase con la [[ropa mojada]]. Fuera, se oían [[truenos]].',q:'¿Qué tiempo hace?',a:'Hay tormenta.',o:['Está nevando.','Hace sol.'],h:'¿Cuándo se oyen truenos?'},
  {t:'Elena abrió el bote de slime y [[se le pegó a todos los dedos]]. Su madre la miró y [[suspiró]].',q:'¿Qué está pensando la madre?',a:'«¡Otra vez a limpiar!»',o:['«¡Qué rico huele!»','«¡Qué miedo!»'],h:'¿Por qué suspira alguien cuando ve algo pegajoso por todas partes?'},
  {t:'Leo [[buscó por toda la casa]]: debajo de la cama, en el sofá y en la mochila. Al final se sentó [[triste]].',q:'¿Qué le pasó a Leo?',a:'No encontró lo que buscaba.',o:['Tenía mucho sueño.','Había ganado un premio.'],h:'Si buscas algo y te quedas triste…'},
  {t:'El camarero trajo la tarta. Tenía [[siete velas]] y una gran letra [[M]].',q:'¿Qué podemos saber?',a:'Alguien cuyo nombre empieza por M cumple 7 años.',o:['Es Navidad.','El camarero cumple años.'],h:'¿Qué nos dicen las velas y la letra?'},
  {t:'Rocío [[practicó la canción todos los días]]. En la función, cantó sin equivocarse y todos aplaudieron.',q:'¿Por qué le salió tan bien?',a:'Porque había ensayado mucho.',o:['Porque tuvo suerte.','Porque cantó otra persona.'],h:'¿Qué hizo Rocío antes de la función?'},
  {t:'Cuando [[sonó el timbre]], todos los niños guardaron los libros y [[salieron al patio]].',q:'¿Qué momento del día es?',a:'La hora del recreo.',o:['La hora de dormir.','El final de las vacaciones.'],h:'¿Cuándo salimos al patio en el cole?'},
  {t:'Carla tardó [[toda la tarde]] en hacer la pulsera. Cuando la terminó, la metió en un [[sobre con un corazón]] para su mejor amiga.',q:'¿Qué siente Carla por su amiga?',a:'La quiere mucho.',o:['Está enfadada con ella.','No la conoce.'],h:'¿Por qué dedicamos tanto tiempo a un regalo?'},
 ]},
 {tag:'Nivel 3',name:'Historias',desc:'Textos de cuatro líneas.',color:'var(--mint)',items:[
  {t:'Por la mañana, Sara vio que el patio estaba [[todo blanco]]. Se puso el gorro, los guantes y la bufanda. Salió corriendo con su hermano y juntos hicieron un [[muñeco con una zanahoria por nariz]].',q:'¿Qué había pasado por la noche?',a:'Había nevado.',o:['Había llovido.','Habían pintado el patio.'],h:'¿Con qué se hace un muñeco con nariz de zanahoria?'},
  {t:'Hugo llevaba una semana cuidando una planta para el concurso del cole. La regaba cada día y la ponía junto a la ventana. El viernes, la profesora le puso una [[medalla dorada]].',q:'¿Qué pasó en el concurso?',a:'Hugo ganó.',o:['Hugo perdió.','La planta se secó.'],h:'¿Quién recibe una medalla dorada?'},
  {t:'Martina entró en la cocina y [[olió algo delicioso]]. En el [[horno]] había algo doradito y en la mesa estaban la [[harina, los huevos y el azúcar]]. Su padre tenía las manos llenas de masa.',q:'¿Qué estaba haciendo su padre?',a:'Un bizcocho.',o:['Una ensalada.','Limpiar la cocina.'],h:'¿Qué se hace con harina, huevos y azúcar en el horno?'},
  {t:'Álex miró por la ventanilla del avión. Las casas parecían [[de juguete]] y los coches eran [[como hormigas]]. Se [[agarró fuerte a su asiento]] y cerró los ojos un momento.',q:'¿Cómo se sentía Álex?',a:'Un poco nervioso.',o:['Aburrido.','Enfadado.'],h:'¿Por qué nos agarramos fuerte y cerramos los ojos?'},
  {t:'Ana y Lola querían el mismo columpio. Las dos tiraban de la cadena y ninguna soltaba. Entonces Ana tuvo una idea: «¡[[Contamos hasta veinte cada una]]!».',q:'¿Qué propone Ana?',a:'Turnarse para usar el columpio.',o:['Irse a casa.','Buscar otro parque.'],h:'Si cada una cuenta hasta veinte…'},
  {t:'El gato de Pedro tenía los [[bigotes blancos de leche]]. El vaso estaba [[volcado]] en la mesa y había gotas por el suelo.',q:'¿Quién tiró la leche?',a:'El gato.',o:['Pedro.','Su madre.'],h:'¿Quién tiene los bigotes manchados?'},
 ]},
 {tag:'Nivel 4',name:'Grandes historias',desc:'Textos de cinco a siete líneas.',color:'var(--sky)',items:[
  {t:'Era el primer día de vacaciones y la familia de Nico cargaba el coche: maletas, [[toallas, cubos y palas]]. En el camino, Nico [[preguntó cinco veces si faltaba mucho]]. Cuando por fin vio el [[agua azul]] a lo lejos, pegó la cara a la ventanilla. Su madre sonrió y le dijo: «Ponte la [[crema]] antes de bajar».',q:'¿A dónde iban?',a:'A la playa.',o:['A la montaña.','A casa de los abuelos.'],h:'Fíjate en lo que meten en el coche y en lo que ve Nico.'},
  {t:'Era el primer día de vacaciones y la familia de Nico cargaba el coche: maletas, toallas, cubos y palas. En el camino, Nico [[preguntó cinco veces si faltaba mucho]]. Cuando por fin vio el agua azul a lo lejos, [[pegó la cara a la ventanilla]]. Su madre sonrió y le dijo: «Ponte la crema antes de bajar».',q:'¿Cómo se sentía Nico durante el viaje?',a:'Tenía muchas ganas de llegar.',o:['Estaba tranquilo y dormido.','Estaba triste.'],h:'¿Por qué preguntamos muchas veces si falta mucho?'},
  {t:'Lucía tenía una caja llena de [[cuentas de colores]]. Separó las rosas, las moradas y las de purpurina. Con mucho cuidado, las fue metiendo en un [[hilo elástico]]. Cuando terminó, hizo un nudo y se la probó en la [[muñeca]]. Después hizo otra igual y la guardó en un sobre con un corazón dibujado.',q:'¿Qué estaba haciendo Lucía?',a:'Una pulsera.',o:['Un collar para el perro.','Un dibujo.'],h:'¿Qué se hace con cuentas y se pone en la muñeca?'},
  {t:'Lucía tenía una caja llena de cuentas de colores. Separó las rosas, las moradas y las de purpurina. Con mucho cuidado, las fue metiendo en un hilo elástico. Cuando terminó, hizo un nudo y se la probó en la muñeca. Después [[hizo otra igual]] y la guardó en un [[sobre con un corazón dibujado]].',q:'¿Para qué crees que era la segunda pulsera?',a:'Para regalársela a alguien que quiere.',o:['Para tirarla a la basura.','Para no perder la primera.'],h:'¿Qué significa un corazón dibujado en un sobre?'},
  {t:'Aquella tarde, el [[cielo se puso gris oscuro]]. Mamá recogió deprisa la ropa del tendedero y cerró las ventanas. Al rato, [[se fue la luz]] y la casa se quedó a oscuras. Jaime buscó la [[linterna]] en el cajón y la encendió. Entonces su hermana pequeña dejó de llorar.',q:'¿Por qué se fue la luz?',a:'Por la tormenta.',o:['Porque Jaime la apagó.','Porque era muy tarde.'],h:'¿Qué pasa cuando el cielo se pone gris oscuro y hay que cerrar las ventanas?'},
  {t:'Aquella tarde, el cielo se puso gris oscuro. Mamá recogió deprisa la ropa del tendedero y cerró las ventanas. Al rato, se fue la luz y la casa se quedó [[a oscuras]]. Jaime buscó la linterna en el cajón y [[la encendió]]. Entonces su hermana pequeña [[dejó de llorar]].',q:'¿Por qué dejó de llorar su hermana?',a:'Porque ya no estaba a oscuras.',o:['Porque le dieron un caramelo.','Porque se quedó dormida.'],h:'¿Qué cambió justo antes de que dejara de llorar?'},
  {t:'En el recreo, Diego estaba solo en un rincón del patio. [[Llevaba pocos días en el colegio]] y [[no conocía a nadie]]. Marta se acercó con una pelota y le preguntó si quería jugar. Diego dijo que sí con una gran sonrisa. Desde ese día, siempre se sientan juntos en el comedor.',q:'¿Por qué estaba solo Diego?',a:'Era nuevo y no conocía a nadie.',o:['Estaba castigado.','No le gustaba jugar.'],h:'Busca lo que dice el texto sobre el tiempo que lleva en el cole.'},
  {t:'En el recreo, Diego estaba solo en un rincón del patio. Llevaba pocos días en el colegio y no conocía a nadie. Marta se acercó con una pelota y le preguntó si quería jugar. Diego dijo que sí con una [[gran sonrisa]]. Desde ese día, [[siempre se sientan juntos]] en el comedor.',q:'¿Qué son ahora Diego y Marta?',a:'Amigos.',o:['Hermanos.','Enemigos.'],h:'¿Con quién nos sentamos siempre?'},
  {t:'El abuelo Tomás se levantó muy temprano, cogió la [[caña]] y una cesta, y se fue al [[río]]. Estuvo sentado en silencio toda la mañana. A mediodía, volvió a casa con la cesta vacía, pero silbando. «Mañana será otro día», dijo mientras dejaba la caña en su sitio.',q:'¿Qué fue a hacer al río?',a:'A pescar.',o:['A bañarse.','A buscar piedras.'],h:'¿Para qué sirve una caña en el río?'},
  {t:'El abuelo Tomás se levantó muy temprano, cogió la caña y una cesta, y se fue al río. Estuvo sentado en silencio toda la mañana. A mediodía, volvió a casa con la [[cesta vacía]], pero [[silbando]]. «[[Mañana será otro día]]», dijo mientras dejaba la caña en su sitio.',q:'¿Cómo se tomó no pescar nada?',a:'Bien, no le importó mucho.',o:['Se enfadó muchísimo.','Se puso a llorar.'],h:'¿Silbamos cuando estamos enfadados?'},
 ]},
];
const BEADS=['#FF8FB8','#B9A2F5','#7FD9C0','#FFD966','#8CC8F5','#FFB38A','#F6A6E0'];
const CHEERS=['¡Bien visto!','¡Eres una detective!','¡Pista encontrada!','¡Genial!','¡Muy bien!','¡Lo has pillado!'];
const HINTS=['¡Casi! Vuelve a leer.','¡Uy! Prueba otra vez.','¡Sigue buscando!'];

let S={view:'home',lv:0,i:0,beads:[],tries:0,order:[]};
let saved={};
try{saved=JSON.parse(localStorage.getItem('pistas-paula')||'{}')}catch(e){saved={}}
function save(){try{localStorage.setItem('pistas-paula',JSON.stringify(saved))}catch(e){}}
const app=document.getElementById('app');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt=t=>esc(t).replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const beadHTML=(b,extra='')=>`<span class="bead ${b.g?'glitter':''} ${extra}" style="background-color:${b.c}"></span>`;

function thread(n){
  let h='';for(let k=0;k<n;k++){const b=S.beads[k];h+=b?beadHTML(b,k===S.beads.length-1&&S.justAdded?'new':''):'<span class="bead slot"></span>'}
  return `<div class="thread" aria-label="Cuentas conseguidas: ${S.beads.length} de ${n}">${h}</div>`;
}
function home(){
  const lvCards=LEVELS.map((L,k)=>{
    const got=saved['L'+k]||[];
    const mini=got.map(b=>`<i style="background:${b.c}"></i>`).join('');
    return `<button class="lv" data-k="${k}" style="border-top:8px solid ${L.color}">
      <span class="tag" style="color:${L.color}">${L.tag}</span><span class="name">${L.name}</span>
      <span class="desc">${L.desc} ${L.items.length} pistas.</span>
      <span class="got">${got.length?`<span class="mini">${mini}</span> Pulsera hecha`:'Pulsera por hacer'}</span></button>`}).join('');
  app.innerHTML=`<div class="hero"><h1>Pulsera de pistas</h1>
    <p class="sub">Lee con calma, busca las pistas y responde. Cada vez que aciertes, ganas una cuenta para tu pulsera.</p></div>
    <div class="levels">${lvCards}</div>
    <div class="tip"><b>Para el adulto:</b> empezad por el nivel 1 y subid cuando lo haga con facilidad. Si se equivoca, el juego le da una pista y puede volver a intentarlo. Al acertar, se iluminan en amarillo las palabras que daban la pista: pedidle que os explique por qué.</div>`;
  app.querySelectorAll('.lv').forEach(b=>b.onclick=()=>start(+b.dataset.k));
}
function start(k){S={view:'play',lv:k,i:0,beads:[],tries:0,order:shuffle(LEVELS[k].items.map((_,n)=>n)).sort((a,b)=>0)};
  // en los niveles 3 y 4 las preguntas de un mismo texto van seguidas; en 1 y 2 se mezclan
  if(k<2)S.order=shuffle(LEVELS[k].items.map((_,n)=>n));else S.order=LEVELS[k].items.map((_,n)=>n);
  play();}
function play(){
  const L=LEVELS[S.lv],it=L.items[S.order[S.i]];
  S.opts=shuffle([it.a,...it.o]);S.tries=0;S.done=false;
  app.innerHTML=`<div class="bar"><button class="back" id="back">← Niveles</button><span class="count">${L.name} · ${S.i+1} de ${L.items.length}</span></div>
    ${thread(L.items.length)}
    <div class="card"><p class="text" id="txt">${fmt(it.t)}</p>
    <p class="q"><span class="lupa" aria-hidden="true">🔎</span><span>${esc(it.q)}</span></p>
    <div class="opts">${S.opts.map((o,n)=>`<button class="opt" data-n="${n}"><span class="l">${'ABC'[n]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div></div>`;
  S.justAdded=false;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,it));
}
function answer(btn,it){
  if(S.done)return;const val=S.opts[+btn.dataset.n],fb=document.getElementById('fb');
  if(val===it.a){
    S.done=true;btn.classList.add('right');
    app.querySelectorAll('.opt').forEach(b=>b.disabled=true);
    document.getElementById('txt').classList.add('show');
    const b={c:BEADS[S.beads.length%BEADS.length],g:S.tries===0};S.beads.push(b);S.justAdded=true;
    const clues=[...it.t.matchAll(/\[\[(.+?)\]\]/g)].map(m=>'«'+m[1]+'»').join(', ');
    fb.innerHTML=`<div class="fb good"><b>${CHEERS[Math.floor(Math.random()*CHEERS.length)]}</b> ${S.tries===0?'¡Y a la primera! Te llevas una cuenta con purpurina. ':''}Las pistas estaban aquí: ${esc(clues)}.</div>
      <div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="next" id="next">${S.i+1<LEVELS[S.lv].items.length?'Siguiente →':'¡Ver mi pulsera!'}</button></div>`;
    const L=LEVELS[S.lv];app.querySelector('.thread').outerHTML=thread(L.items.length);
    document.getElementById('next').onclick=()=>{S.i++;S.i<L.items.length?play():finish()};
    document.getElementById('next').focus();
  }else{
    S.tries++;btn.classList.add('wrong');btn.disabled=true;
    fb.innerHTML=`<div class="fb hint"><b>${HINTS[(S.tries-1)%HINTS.length]}</b> Pista: ${esc(it.h)}</div>`;
  }
}
function finish(){
  const L=LEVELS[S.lv];saved['L'+S.lv]=S.beads;save();
  const n=S.beads.length,R=50;
  const ring=S.beads.map((b,k)=>{const a=k/n*2*Math.PI-Math.PI/2;return `<span class="bead ${b.g?'glitter':''}" style="background-color:${b.c};left:${50+44*Math.cos(a)}%;top:${50+44*Math.sin(a)}%"></span>`}).join('');
  const glitter=S.beads.filter(b=>b.g).length;
  const nextLv=S.lv+1<LEVELS.length;
  app.innerHTML=`<div class="end"><h2>¡Pulsera terminada!</h2>
    <div class="ring">${ring}</div>
    <p class="sub">Has encontrado ${n} pistas${glitter?` y ${glitter} ${glitter===1?'cuenta tiene':'cuentas tienen'} purpurina por acertar a la primera`:''}.</p>
    <div class="btns">${nextLv?`<button class="next" id="nx">Siguiente nivel →</button>`:''}<button class="ghost" id="again">Jugar otra vez</button><button class="ghost" id="hm">Volver a los niveles</button></div></div>`;
  if(nextLv)document.getElementById('nx').onclick=()=>start(S.lv+1);
  document.getElementById('again').onclick=()=>start(S.lv);
  document.getElementById('hm').onclick=home;
}
home();
</script>

</body></html>
