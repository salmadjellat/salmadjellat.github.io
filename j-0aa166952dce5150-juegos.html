<!doctype html>

<title>El castillo de las palabras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Un castillo de cuento al atardecer: cielo lila con estrellas, torres y hadas; cada acierto es una estrella mágica. Un único aspecto, elegido a propósito. */
:root{
  --cesped:#B9A2F5; --cesped2:#F7B8D6; --linea:#FFFFFF; --cielo:#BFE6FF;

}
*{box-sizing:border-box}
html{background:#F2A9CC}html,body{margin:0;min-height:100vh;background:var(--cesped);color:var(--tinta);font-family:var(--display)}

.wrap{max-width:820px;margin:0 auto;padding-block:14px 30px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{background:var(--papel);border:3px solid var(--tinta);border-radius:999px;padding:8px 16px;font-weight:600;font-size:16px;text-decoration:none;color:var(--tinta);display:inline-flex;gap:6px;align-items:center}
.marcador{background:var(--tinta);color:#fff;border-radius:14px;padding:6px 14px;font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.marcador b{color:var(--oro);font-size:24px}

.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.juego{background:var(--papel);border:4px solid var(--tinta);border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 0 var(--tinta);transition:transform .1s}

.juego .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.juego b{font-size:21px}
.juego span{font-size:15px;color:var(--suave);font-family:var(--letra)}
.juego .estrellas{color:var(--oro);font-size:16px}
/* campo de juego */
.campo{background:var(--papel);border:4px solid var(--tinta);border-radius:28px;padding:18px clamp(12px,3vw,26px) 22px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 7px 0 var(--tinta);position:relative;overflow:hidden}
.titulo{font-size:22px;font-weight:700;text-align:center}

.dibujo{font-size:clamp(90px,22vw,150px);line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;user-select:none}
.opciones{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%}
.op{min-width:84px;min-height:84px;padding:10px 18px;background:#F4F8FB;border:4px solid var(--tinta);border-radius:22px;font-family:var(--letra);font-weight:700;font-size:clamp(34px,8vw,48px);box-shadow:0 5px 0 var(--tinta);transition:transform .1s,background .2s}
.op:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.op.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:clamp(46px,11vw,64px)}
.op.ok{background:#D9F7E5;border-color:var(--ok)}

.palabra{display:flex;gap:8px;align-items:center;font-family:var(--letra);font-weight:700;font-size:clamp(46px,12vw,70px)}
.sil{min-width:110px;text-align:center;padding:4px 14px;border-radius:18px;background:#FFF6D6;border:4px solid var(--tinta)}
.sil.hueco{background:#fff;border-style:dashed;color:#B9C4CC}
.balones{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.pers:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}
.pers .cara{font-size:clamp(56px,14vw,80px);line-height:1;font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.pers b{font-size:26px}.pers span:last-child{font-family:var(--letra);font-size:24px;font-weight:700;color:#8A4FD8}
.pers.ok{background:#D9F7E5;border-color:var(--ok)}.pers.mal{background:#FFE1E1;animation:sacude .4s;opacity:.5}.pers.pista{animation:brilla 1s infinite}
.msg{font-size:22px;font-weight:700;min-height:1.3em;text-align:center}
.gol{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.85);font-size:clamp(46px,12vw,80px);font-weight:700;color:#8A4FD8;pointer-events:none;animation:gol 1s forwards}
@keyframes gol{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1.1)}80%{opacity:1;transform:scale(1)}100%{opacity:0}}
.progreso{display:flex;gap:6px;justify-content:center}
.progreso i{width:22px;height:22px;border-radius:50%;background:#E3E8EC;border:2px solid var(--tinta);display:block;font-style:normal;font-size:14px;line-height:18px;text-align:center}
.progreso i.hecho{background:var(--oro)}
.final{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.trofeo{font-size:110px;font-family:"Noto Color Emoji","Apple Color Emoji",sans-serif;animation:salto 1s infinite}
@keyframes salto{50%{transform:translateY(-12px)}}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--azul);color:#fff;border:4px solid var(--tinta);border-radius:999px;padding:12px 24px;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--tinta)}
.btn.blanco{background:#fff;color:var(--tinta)}
.nota{background:rgba(255,255,255,.92);border-radius:16px;padding:12px 16px;font-family:var(--letra);font-size:15px;line-height:1.5;color:var(--suave)}
.nota b{color:var(--tinta)}
@media (max-width:560px){.menu{grid-template-columns:1fr}.sil{min-width:86px}.porteria{min-height:110px;font-size:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.com-l{font-weight:800;color:#4A3326;background:rgba(255,255,255,.9);border-radius:10px;padding:4px 10px}.com-l span{font-weight:600;color:#7A6252;font-size:13px}.com-t{width:100%;font:inherit;font-size:16px;border:2px solid #E8D9C5;border-radius:14px;padding:10px;resize:vertical;background:#fff;color:#4A3326}.wa-btn.mail{background:#6F4A30}.wa-otro{font:inherit;font-weight:800;background:rgba(255,255,255,.9);border:2px solid #25D366;color:#1E8E4C;border-radius:999px;padding:8px 16px;cursor:pointer}.env-ok{font-weight:800;color:#2E6B47;background:rgba(255,255,255,.9);border-radius:10px;padding:2px 10px;min-height:0}.env-ok:empty{display:none}
.wa-caja{display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px auto 0;max-width:420px;width:100%;text-align:center}.wa-btn{font:inherit;font-weight:800;font-size:17px;background:#25D366;color:#fff;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}.wa-caja small{color:#7A6252;background:rgba(255,255,255,.85);border-radius:10px;padding:4px 10px;font-size:13px}
.juego.hoy{box-shadow:0 0 0 4px #F2C94C,0 8px 20px rgba(0,0,0,.12)}.hoy-b{background:#FFF3C4!important;color:#8A6A00!important}.dia-msg{background:rgba(255,255,255,.92);color:#4A3326;border-radius:16px;padding:10px 14px;font-weight:700;margin:4px 0 10px;text-align:center}
.juego.cerrado{opacity:.55;filter:grayscale(.7);cursor:not-allowed}.juego.cerrado:hover{transform:none}.candado{display:inline-block;margin-top:4px;font-size:13px;font-weight:800;color:#8A6E5C;background:#F1E8DC;border-radius:999px;padding:2px 10px}.modal-cod{position:fixed;inset:0;background:rgba(40,25,15,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}.caja-cod{background:#fff;border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center;color:#4A3326;font-family:Nunito,Verdana,sans-serif}.caja-cod b{font-size:20px}.caja-cod p{margin:6px 0 12px;color:#7A6252}.caja-cod input{width:100%;font:inherit;font-size:24px;font-weight:800;text-align:center;letter-spacing:.12em;padding:10px;border:2px solid #E8D9C5;border-radius:14px;text-transform:uppercase}.err-cod{color:#A2403B;font-weight:700;min-height:22px;margin-top:6px;font-size:14px}.bts-cod{display:flex;gap:10px;margin-top:8px}.bts-cod button{flex:1;font:inherit;font-weight:800;border-radius:14px;padding:12px;border:2px solid #E8D9C5;background:#fff;color:#6F4A30;cursor:pointer}.bts-cod .cod-si{background:#6F4A30;color:#fff;border-color:#6F4A30}.tengo-cod{display:block;margin:14px auto 0;font:inherit;font-weight:800;background:#fff;color:#6F4A30;border:2px dashed #C9B6A0;border-radius:999px;padding:10px 18px;cursor:pointer}
.aviso-cerrado{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#4A3326;color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;z-index:99;max-width:90vw;text-align:center}
</style><script>document.write('<script src="abiertos.js?t='+Date.now()+'"><\/script>')</script></head><body>
<div class="wrap" id="app"></div>
<script>
const E={casa:'🏠',silla:'🪑',luna:'🌙',sapo:'🐸',pato:'🦆',gato:'🐱',foca:'🦭',vaca:'🐄',mono:'🐒',lobo:'🐺',pera:'🍐',dado:'🎲',rosa:'🌹',nube:'☁️',coche:'🚗',uvas:'🍇',oso:'🐻',moto:'🏍️',cama:'🛏️',sopa:'🍲',bota:'👢',seta:'🍄',sandía:'🍉',tambor:'🥁',limón:'🍋',
sol:'☀️',pez:'🐟',tren:'🚂',flor:'🌸',pan:'🍞',pie:'🦶',
pelota:'⚽',tomate:'🍅',conejo:'🐰',patata:'🥔',zapato:'👞',gallina:'🐔',manzana:'🍎',ballena:'🐋',jirafa:'🦒',caracol:'🐌',tortuga:'🐢',
mariposa:'🦋',elefante:'🐘',cocodrilo:'🐊',bicicleta:'🚲',calabaza:'🎃',
mano:'✋',nariz:'👃',ratón:'🐭',tomate2:'🍅',árbol:'🌳',isla:'🏝️',
boca:'👄',rana:'🐸',camión:'🚚',león:'🦁',corazón:'❤️',abeja:'🐝',oveja:'🐑',lechuga:'🥬',espejo:'🪞',chocolate:'🍫',ventana:'🪟'};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>pickNuevo(a,n);
const RONDAS=8;
const app=document.getElementById('app');
let goles=0; try{goles=+localStorage.getItem('clara-estrellas')||0}catch(e){}
let est={}; try{est=JSON.parse(localStorage.getItem('clara-est')||'{}')}catch(e){}
const guardar=()=>{try{localStorage.setItem('clara-estrellas',goles);localStorage.setItem('clara-est',JSON.stringify(est))}catch(e){}};

/* ---------- datos de cada juego ---------- */
const SILABAS={1:['sol','pez','tren','flor','pan','pie'],2:['casa','luna','sapo','pato','gato','foca','vaca','mono','oso','moto','uvas','nube'],3:['pelota','tomate','conejo','patata','zapato','gallina','manzana','ballena','jirafa','caracol','tortuga'],4:['mariposa','elefante','cocodrilo','bicicleta','calabaza']};
const BIS=[['ca','sa','casa'],['lu','na','luna'],['sa','po','sapo'],['pa','to','pato'],['ga','to','gato'],['fo','ca','foca'],['va','ca','vaca'],['mo','no','mono'],['lo','bo','lobo'],['pe','ra','pera'],['da','do','dado'],['ro','sa','rosa'],['nu','be','nube'],['mo','to','moto'],['ca','ma','cama'],['so','pa','sopa'],['bo','ta','bota']];
const INI=[['mono','m'],['moto','m'],['mano','m'],['pato','p'],['pera','p'],['pez','p'],['seta','s'],['sol','s'],['silla','s'],['luna','l'],['lobo','l'],['tomate','t'],['tren','t'],['nube','n'],['nariz','n'],['dado','d'],['foca','f'],['flor','f'],['rosa','r'],['ratón','r'],['casa','c'],['coche','c'],['vaca','v'],['gato','g'],['oso','o'],['uvas','u'],['árbol','a'],['elefante','e']];
const GRUPOS={m:['mono','moto','mano','manzana','mariposa'],s:['sol','silla','seta','sandía'],p:['pato','pera','pez','pelota','patata'],l:['luna','lobo','león','limón'],t:['tomate','tren','tortuga','tambor'],c:['casa','coche','conejo','cama','caracol']};
const PARES=[['m','s'],['p','t'],['l','m'],['c','p'],['s','t'],['c','m'],['l','s']];
const RIMAS=[['gato','pato','zapato'],['foca','boca'],['pelota','bota'],['caracol','sol'],['manzana','ventana'],['ratón','camión','león','corazón'],['abeja','oveja'],['tortuga','lechuga'],['conejo','espejo'],['tomate','chocolate']];

const DW=[['dado','🎲'],['nido','🪺'],['diente','🦷'],['delfín','🐬'],['helado','🍦'],['candado','🔒'],['espada','🗡️'],['moneda','🪙'],['ducha','🚿'],['dedal','🪡']];
const RW=[['pera','🍐'],['loro','🦜'],['toro','🐂'],['corona','👑'],['mariposa','🦋'],['jirafa','🦒'],['cereza','🍒'],['oreja','👂'],['sirena','🧜‍♀️'],['caramelo','🍬']];
const DP=['dida','mada','lodu','tide','sadi','nodo','pude','fida'];
const RP=['mara','tira','lori','sure','pira','nero','fura','bara'];
const JUEGOS=[
 {id:'dm1',ico:'🐉',nombre:'Dida y Mara · con dibujo',desc:'¿Suena la d de Dida o la r de Mara?'},
 {id:'dm2',ico:'👂',nombre:'Dida y Mara · solo oído',desc:'Escucha sin ver el dibujo.'},
 {id:'dm3',ico:'🪄',nombre:'Dida y Mara · palabras mágicas',desc:'Palabras inventadas: ¡a escuchar!'},
 {id:'silabas',ico:'👏',nombre:'Palmadas de sílabas',desc:'¿Cuántas palmadas tiene?'},
 {id:'termina',ico:'🧩',nombre:'Termina la palabra',desc:'Elige la sílaba que falta.'},
 {id:'inicial',ico:'🔤',nombre:'¿Por qué letra empieza?',desc:'Busca la primera letra.'},
 {id:'porterias',ico:'🏰',nombre:'Las dos torres',desc:'Lleva cada dibujo a su torre.'},
 {id:'rimas',ico:'🎵',nombre:'Cazarrimas',desc:'¿Cuál suena igual al final?'},
];

/* ---------- menú ---------- */
function menu(){
  location.hash='';
  app.innerHTML=`<div class="top"><a class="chip" href="j-0aa166952dce5150.html">← Mis juegos</a><div class="marcador">✨ Estrellas <b>${goles}</b></div></div>
  <h1>El castillo de las palabras</h1><p class="sub">Elige un juego. ¡Cada acierto es una estrella mágica!</p>
  <div class="menu">${JUEGOS.map(j=>`<button class="juego" data-id="${j.id}"><span class="ico">${j.ico}</span><span class="t"><b>${j.nombre}</b><span>${j.desc}</span><span class="estrellas">${est[j.id]?'👑 ×'+est[j.id]:''}</span></span></button>`).join('')}</div>
  <div class="nota"><b>Para el adulto:</b> los dibujos no llevan el nombre escrito a propósito, para que Clara los nombre en voz alta y escuche sus sonidos. Si duda con algún dibujo, decidle vosotros el nombre. Si falla dos veces, la respuesta correcta brilla para ayudarla. En <b>Dida y Mara</b>, decid vosotros la palabra que aparece en pequeño, con calma y sin exagerar el sonido; Clara elige si ha oído la d de Dida o la r de Mara.</div>`;
  app.querySelectorAll('.juego').forEach(b=>b.onclick=()=>empezar(b.dataset.id));
}

/* ---------- motor común ---------- */
let J=null;
function empezar(id){J={id,ronda:0,fallos:0,items:generar(id)};location.hash=id;pintar()}
function generar(id){
  if(id==='silabas'){const pool=[...pick(SILABAS[1],1),...pick(SILABAS[2],3),...pick(SILABAS[3],3),...pick(SILABAS[4],1)];return sh(pool).map(w=>({w,n:+Object.keys(SILABAS).find(k=>SILABAS[k].includes(w))}))}
  if(id==='termina')return pick(BIS,RONDAS);
  if(id==='inicial')return pick(INI,RONDAS);
  if(id==='porterias'){const [a,b]=pick(PARES,1)[0];const it=sh([...pick(GRUPOS[a],4).map(w=>({w,l:a})),...pick(GRUPOS[b],4).map(w=>({w,l:b}))]);it.par=sh([a,b]);return it}
  if(id==='dm1'||id==='dm2')return sh([...pick(DW,4).map(([w,e])=>({w,e,k:'d'})),...pick(RW,4).map(([w,e])=>({w,e,k:'r'}))]);
  if(id==='dm3')return sh([...pick(DP,4).map(w=>({w,k:'d'})),...pick(RP,4).map(w=>({w,k:'r'}))]);
  if(id==='rimas')return pick(RIMAS,RONDAS).map(g=>{const [a,b]=pick(g,2);const otros=pick(RIMAS.filter(x=>x!==g),2).map(x=>pick(x,1)[0]);return [a,b,otros]});
}
function cabecera(){
  const j=JUEGOS.find(x=>x.id===J.id);
  return `<div class="top"><button class="chip" id="volver">← Juegos</button><div class="marcador">✨ Estrellas <b>${goles}</b></div></div>
  <div class="progreso">${Array.from({length:RONDAS},(_,i)=>`<i class="${i<J.ronda?'hecho':''}">${i<J.ronda?'⭐':''}</i>`).join('')}</div>`;
}
function pintar(){
  if(J.ronda>=RONDAS)return final();
  J.fallos=0;
  const it=J.items[J.ronda];let cuerpo='';
  if(J.id==='silabas'){
    cuerpo=`<div class="titulo">Palmadas de sílabas</div><div class="consigna">Di el nombre dando palmadas. ¿Cuántas palmadas son?</div>
    <div class="dibujo">${E[it.w]}</div><div class="palmas" id="palmas"></div><button class="palmar" id="palmar">👏 Dar palmada</button>
    <div class="balones">${[1,2,3,4].map(n=>`<button class="bal op" data-v="${n}">${n}</button>`).join('')}</div>`;
