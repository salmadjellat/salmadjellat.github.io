let J=null;
function empezar(id){J={id,ronda:0,fallos:0,items:generar(id)};location.hash=id;pintar()}
function generar(id){
  if(id==='silaba'){const p2=PAL.filter(p=>p[2].length===2),p3=PAL.filter(p=>p[2].length===3),p4=PAL.filter(p=>p[2].length===4);
    return [...pick(p2,2),...pick(p3,3),...pick(p4,3)].map(p=>({p,g:Math.floor(Math.random()*p[2].length)}))}
  if(id==='slime'){const p3=PAL.filter(p=>p[2].length===3),p4=PAL.filter(p=>p[2].length===4);return [...pick(p3,4),...pick(p4,4)]}
  if(id==='fuente'){const a=GW.filter(w=>['ga','go','gu'].includes(w[2][w[3]])),b=GW.filter(w=>['gue','gui'].includes(w[2][w[3]]));return sh([...pick(a,4),...pick(b,4)])}
  if(id==='espejo')return pick(ESP,RONDAS);
  if(id==='adivina')return pick(ADV,RONDAS);
  if(id==='colado')return pick(INT,RONDAS).map(([cat,fam,otros])=>({cat,ok:una(otros),fam:pick(fam,3)}));
  if(id==='parejas')return pick(PAR,RONDAS);
  if(id==='haciendo')return pick(VERB,RONDAS).map(v=>({v,otros:sh(VERB.filter(x=>x!==v)).slice(0,3)}));
}

}

function quitarUno(){const malos=[...app.querySelectorAll('.op[data-v]')].filter(b=>!esCorrecta(b)&&!b.classList.contains('fuera')&&b.style.visibility!=='hidden');

function ini(s){return /^(ll|ch|rr)/.test(s)?s.slice(0,2):s[0]}
function darPista(){
  const n=J.fallos-2;if(n<0)return;              /* las pistas empiezan en el 3.er intento */
  let t=PISTAS[Math.min(n,PISTAS.length-1)];
  if(t==='__siguiente__'){const s=J.ok[J.slot];t=`El trozo que va ahora empieza por «${ini(s)}».`}
  if(t.startsWith('Mira: ya he quitado'))quitarUno();
  if(J.id==='silaba'&&n===0)document.getElementById('hueco').classList.add('marca');
  const p=document.getElementById('pista');p.classList.remove('si');void p.offsetWidth;p.classList.add('si');document.getElementById('pistaT').textContent=t;sPista();
}
function acierto(btn){
  J.bloq=true;btn.classList.add('ok');gemas++;guardar();sBien();slime('feliz');
  if(['silaba','fuente'].includes(J.id)){const h=document.getElementById('hueco');h.textContent=btn.dataset.v;h.classList.remove('hueco','marca')}
  fiesta();const g=document.createElement('div');g.className='bien';g.textContent=una(BIEN);document.getElementById('campo').appendChild(g);
  setTimeout(()=>{J.bloq=false;J.primera=(J.primera||0)+(J.fallos===0?1:0);J.ronda++;pintar()},1400);
}
function responder(btn){
  if(J.bloq||btn.classList.contains('fuera'))return;
  if(J.id==='slime'){
    if(esCorrecta(btn)){const h=document.getElementById('h'+J.slot);h.textContent=btn.dataset.v.split('|')[0];h.classList.add('lleno');h.classList.remove('ahora');btn.style.visibility='hidden';tono([784+J.slot*120],.08,'triangle');
      J.slot++;document.getElementById('pista').classList.remove('si');app.querySelectorAll('.op.fuera').forEach(b=>b.classList.remove('fuera'));
      if(J.slot>=J.ok.length){J.bloq=true;gemas++;guardar();sBien();slime('feliz');fiesta();const g=document.createElement('div');g.className='bien';g.textContent=una(BIEN);document.getElementById('campo').appendChild(g);
        setTimeout(()=>{J.bloq=false;J.primera=(J.primera||0)+(J.fallos===0?1:0);J.ronda++;pintar()},1400)}
      else document.getElementById('h'+J.slot).classList.add('ahora');return}
    J.fallos++;btn.classList.add('mal');setTimeout(()=>btn.classList.remove('mal'),450);sMal();slime('triste');
    document.getElementById('msg').textContent=una(ANIMO);darPista();return}
  if(esCorrecta(btn))return acierto(btn);
  J.fallos++;btn.classList.add('mal');setTimeout(()=>btn.classList.remove('mal'),450);sMal();slime('triste');
  document.getElementById('msg').textContent=una(ANIMO);darPista();
}
